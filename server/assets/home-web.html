<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Home</title>
<script src="/assets/home-kit.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<!--
  A custom launcher given as a web address (lib/home-launcher.js). The site
  opens in this frame rather than as the page itself, so it never runs as LG's
  Home app, and the heartbeat goes on beside it whatever the site does. The
  server fills in src.
-->
<iframe id="page" src="about:blank" data-launcher allow="autoplay; fullscreen"></iframe>
<script>
(function () {
  var frame = document.getElementById('page');
  // The remote's keys go to the site, not to this page around it.
  function focusSite() { try { frame.focus(); frame.contentWindow.focus(); } catch (e) {} }
  // Black while it loads; then white behind a site that sets no background, as a browser shows it.
  frame.onload = function () {
    if (frame.src !== 'about:blank') frame.style.background = '#fff';
    focusSite();
  };
  window.addEventListener('focus', focusSite);
  focusSite();
})();
</script>
</body>
</html>
