<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glasshouse Home</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;color:#ece7df;overflow:hidden;font-family:sans-serif;cursor:none}
#splash{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;-webkit-transition:opacity .3s;transition:opacity .3s}
#splash.on{opacity:1}
#splash svg{position:absolute;left:50%;top:50%;width:14vh;height:14vh;margin:-7vh 0 0 -7vh}
#status{position:absolute;left:0;right:0;top:62vh;text-align:center;font-size:2.4vh;color:#6b665e}
</style>
</head>
<body>
<div id="splash">
  <!-- The Glasshouse mark, as in favicon.svg: a G whose top is a roof. -->
  <svg viewBox="0 0 512 512"><path d="M358 214 L256 134 L154 214 V342 A34 34 0 0 0 188 376 H324 A34 34 0 0 0 358 342 V286 H272" fill="none" stroke="#ece7df" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="status"></div>
</div>
<script>
/*
 * Glasshouse Home's app, which the TV opens as its Home: mounted over LG's
 * Home under its id (lib/home-takeover.js). The view itself is served by the
 * Glasshouse server on this TV; this page opens it once the server answers.
 * After a cold start the boot hook mounts it about 25 s in and the server
 * answers some 10 s later (a G3, webOS 9.2), so the page shows the Glasshouse
 * mark on black in between, and fades it out before the view opens. Being LG's
 * Home's app, it cannot open LG's Home: a server that does not come back is the
 * watchdog's to undo (tvwebctl), which puts LG's Home back in its place.
 */
(function () {
  // Filled in with the dashboard's port when the server stages this page.
  var PORT = 8080;                // tvweb:port
  var BASE = 'http://localhost:' + PORT;
  var SLOW_MS = 30000;
  var FADE_MS = 300;
  var started = Date.now();
  var done = false;
  var splash = document.getElementById('splash');

  // Launched with { wall } or { hour }, the view shows that wallpaper slot,
  // to check each one on the panel.
  function preview() {
    var p = {};
    try { p = JSON.parse(window.PalmSystem.launchParams || '{}') || {}; } catch (e) {}
    var out = '';
    if (/^[a-z]+$/.test(String(p.wall || ''))) out += '&wall=' + p.wall;
    if (/^\d{1,2}$/.test(String(p.hour || ''))) out += '&hour=' + p.hour;
    return out;
  }

  function openView() {
    if (done) return;
    done = true;
    var url = BASE + '/assets/home.html?t=' + Date.now() + preview();
    // Answered at once, the server was already up: no mark to fade.
    if (splash.className !== 'on') return location.replace(url);
    splash.className = '';
    setTimeout(function () { location.replace(url); }, FADE_MS);
  }

  function retry() {
    if (Date.now() - started >= SLOW_MS) {
      document.getElementById('status').textContent = 'Glasshouse is not answering yet. LG\'s Home comes back if it stays silent.';
    }
    setTimeout(probe, 600);
  }

  function probe() {
    if (done) return;
    var x = new XMLHttpRequest();
    // from=home tells the server this page is running (lib/home.js watchStart).
    x.open('GET', BASE + '/api/caps?from=home&t=' + Date.now(), true);
    x.timeout = 1500;
    x.onload = function () { if (x.status >= 200 && x.status < 400) openView(); else retry(); };
    x.onerror = x.ontimeout = retry;
    x.send();
  }

  // Shown only where the server is slow to answer, so an open with the server
  // up goes straight to the view.
  setTimeout(function () { if (!done) splash.className = 'on'; }, 400);
  probe();
})();
</script>
</body>
</html>
