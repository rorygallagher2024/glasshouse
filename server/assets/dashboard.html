<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Glasshouse</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/dashboard-app/assets/icon130.png">
<style>
/* The dashboard as it appears on the TV itself, driven by the remote.
   Left/Right flips between sections, Up/Down moves within one, Enter acts on
   the selected row. Outfit for headings (the spectacle face), Manrope for the
   rows, on true black. Sized for 1080p viewed from the sofa, which is why the
   type is large and the palette is opacity steps rather than colour. */
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Light.ttf') format('truetype');font-weight:300;font-display:swap}
@font-face{font-family:'Outfit';src:url('/assets/fonts/Outfit-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:'Manrope',sans-serif;color:#fff;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

#stage{width:100%;height:100vh;display:flex;display:-webkit-flex;flex-direction:column;-webkit-flex-direction:column;padding:5vh 0 5vh 8vw}

/* The clock on the left and the Glasshouse mark on the right, at the clock's
   height and full strength, level with the end of the tab bar. */
#top{display:flex;display:-webkit-flex;align-items:center;-webkit-align-items:center;
  justify-content:space-between;-webkit-justify-content:space-between;flex:0 0 auto;-webkit-flex:0 0 auto;margin:0 4vw 3.4vh 0}
#mark{height:4.6vh;width:auto;color:#fff;opacity:.92}
#clock{font-family:'Manrope',sans-serif;font-weight:400;font-size:4.4vh;letter-spacing:.01em;
  line-height:1;opacity:.65}

#tabs{display:flex;display:-webkit-flex;align-items:baseline;-webkit-align-items:baseline;flex:0 0 auto;-webkit-flex:0 0 auto;margin:0 4vw 3.2vh 0;
  /* the bar clips so it can scroll, and at line-height 1 that takes the tails
     of g and y with it; the padding makes room and the margin gives it back */
  padding-bottom:1.2vh;white-space:nowrap;overflow:hidden}
#tabs.clip-r{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
#tabs.clip-l{-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
#tabs.clip-l.clip-r{-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)}
.tab{display:inline-block;font-family:'Manrope',sans-serif;font-weight:400;font-size:4.2vh;line-height:1;letter-spacing:.01em;
  color:rgba(255,255,255,.50);transition:color .22s ease;white-space:nowrap;
  flex:0 0 auto;-webkit-flex:0 0 auto;padding-right:2.8vw;cursor:pointer}
.tab:last-child{padding-right:0}
/* A hidden bold copy sets each tab's width, so selecting one (which bolds it)
   does not push the tabs after it along. */
.tab::after{content:attr(data-label);display:block;font-weight:600;height:0;overflow:hidden;visibility:hidden}
.tab.on{color:#fff;font-weight:600}

/* Two columns: the rows on the left, an explainer for whichever row is selected
   on the right. A row's label and value never needed the full width, and the
   space buys somewhere to say what a setting means without a second screen. */
#main{flex:1 1 auto;-webkit-flex:1 1 auto;display:flex;display:-webkit-flex;overflow:hidden;padding-right:4vw;min-height:0}
/* No height: the row is stretched to #main's. A percentage height resolves to
   none on a flex item in Chromium 53 (webOS 4) and WebKit 538.2 (webOS 2),
   collapsing #list to 0 px and hiding every row; position() covers an engine
   that still leaves it at 0. */
#list{flex:1 1 62%;-webkit-flex:1 1 62%;overflow:hidden;position:relative}
#rows{position:absolute;left:0;right:0;-webkit-transition:-webkit-transform .28s cubic-bezier(.4,0,.2,1);transition:transform .28s cubic-bezier(.4,0,.2,1)}

#hint{flex:0 0 31%;-webkit-flex:0 0 31%;margin-left:2.6vw;align-self:center;-webkit-align-self:center;border-left:1px solid rgba(255,255,255,.14);
  padding-left:2.4vw;opacity:0;-webkit-transition:opacity .22s ease;transition:opacity .22s ease}
#hint.on{opacity:1}
.h-title{font-family:'Manrope',sans-serif;font-weight:600;font-size:3.4vh;line-height:1.15;
  letter-spacing:.005em;margin-bottom:1.6vh}
.h-body{font-family:'Manrope',sans-serif;font-weight:400;font-size:2.1vh;line-height:1.65;
  color:rgba(255,255,255,.68)}
.h-warn{display:none;font-family:'Manrope',sans-serif;font-weight:400;font-size:2vh;line-height:1.6;
  color:rgba(255,255,255,.78);border-left:2px solid #ff9800;padding-left:1.2vw;margin-top:1.8vh}
.h-warn.on{display:block}
/* What OK does here, or that it does nothing. Green only when there is
   something to press, so the colour itself carries the distinction. */
.h-act{font-family:'Manrope',sans-serif;font-weight:600;font-size:1.7vh;letter-spacing:.14em;
  text-transform:uppercase;margin-top:2.4vh;color:#1ec15f}
.h-act.ro{color:rgba(255,255,255,.50)}

/* For the few rows that can only be changed in a browser: a code to scan and
   the address under it, so the dashboard can be opened without typing an
   address on a remote. White on black would invert the code, so it sits on a
   white tile with its own quiet zone. */
.h-qr{margin-top:2.4vh;display:none}
.h-qr.on{display:block}
.h-qr svg{width:15vh;height:15vh;display:block;background:#fff;padding:1vh;border-radius:.6vh}
.h-url{font-family:'Manrope',sans-serif;font-weight:400;font-size:1.6vh;letter-spacing:.01em;
  color:rgba(255,255,255,.55);margin-top:1.2vh;word-break:break-all}

/* A row is a label and its value. Only the selected one is full white and
   slightly enlarged; the rest recede, so the eye lands on the choice. */
/* The right padding is the scroll arrows' lane, so a long value never runs
   underneath one. */
.row{display:flex;display:-webkit-flex;align-items:baseline;-webkit-align-items:baseline;justify-content:space-between;-webkit-justify-content:space-between;height:7.6vh;
  padding-right:3.4vw;
  opacity:.55;-webkit-transition:opacity .22s ease,-webkit-transform .22s ease;transition:opacity .22s ease,transform .22s ease;
  -webkit-transform-origin:left center;transform-origin:left center}
.row:not(.head){cursor:pointer}
.row.sel{opacity:1;-webkit-transform:scale(1.03);transform:scale(1.03)}
.lbl{font-family:'Manrope',sans-serif;font-weight:500;font-size:3.1vh;letter-spacing:.01em}
.val{font-family:'Manrope',sans-serif;font-weight:400;font-size:3.1vh;color:rgba(255,255,255,.75);
  text-align:right;white-space:nowrap;padding-left:2vw}
.row.sel .val{font-weight:600;color:rgba(255,255,255,.90)}
/* A second, smaller line under a value, in the space the row leaves below it.
   A row with two is taller by one such line (TALL_VH). */
.val .sub{display:block;font-size:2.1vh;line-height:1.2;font-weight:400;color:rgba(255,255,255,.5)}
.row.tall{height:10.2vh}
/* Catalog rows: an icon, a version and a root badge beside the title. The
   title gives way with an ellipsis rather than pushing the state off the row. */
.row.cat .lbl{flex:1 1 auto;-webkit-flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cat .val{font-size:2.6vh}
.lbl .ic{width:4.4vh;height:4.4vh;border-radius:.8vh;object-fit:contain;background:rgba(255,255,255,.08);
  vertical-align:middle;margin-right:1.4vh}
.lbl .ic.none{display:inline-block}
.lbl .ver{font-weight:400;font-size:2.2vh;color:rgba(255,255,255,.55);margin-left:1.2vh}
.lbl .bdg{font-weight:600;font-size:1.5vh;letter-spacing:.14em;text-transform:uppercase;color:#ff9800;
  border:1px solid currentColor;border-radius:.6vh;padding:.2vh .8vh;margin-left:1.2vh;vertical-align:middle}
.val.on{color:#1ec15f}
.val.off{color:rgba(255,255,255,.45)}
.val.bad{color:#e65050}
.val.warn{color:#ff9800}
.val.act{color:rgba(255,255,255,.50)}
.row.sel .val.act{color:#1ec15f}
.row.sel .val.bad{color:#ff6b6b}
.row.sel .val.warn{color:#ffb74d}
/* A read-out rather than a setting: a status label with a lit dot, set small in
   capitals, so it cannot be mistaken for the On/Off values of the toggles. The
   glow is a blurred shadow: color-mix is too new for the webOS 4 browser. */
.val.st{display:inline-flex;display:-webkit-inline-flex;align-items:center;-webkit-align-items:center;font-size:2.1vh;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase}
.val.st::before{content:'';width:1vh;height:1vh;border-radius:50%;margin-right:1.3vh;
  background:currentColor;box-shadow:0 0 1.2vh currentColor}
.val.st.good,.row.sel .val.st.good{color:#1ec15f}
.val.st.hold,.row.sel .val.st.hold{color:#ff9800}
.val.st.note,.row.sel .val.st.note{color:rgba(255,255,255,.55)}
.val.st.bad,.row.sel .val.st.bad{color:#e65050}

/* The mark that separates a row you can press from one you can only read. It
   sits in a gutter every row reserves, so nothing shifts as the eye moves down
   and the pressable ones line up as a column of their own. */
.lbl::before{content:'';display:inline-block;width:.9vh;height:.9vh;
  border-radius:50%;margin-right:1.6vh;vertical-align:middle;
  background:transparent;transition:background .22s ease}
.row.doable .lbl::before{background:rgba(255,255,255,.45)}
.row.doable.sel .lbl::before{background:#1ec15f}

/* A heading inside the list - groups rows without being selectable itself. */
.row.head{height:5.4vh;opacity:1;-webkit-transform:none;transform:none}
.row.head .lbl{font-family:'Manrope';font-weight:600;font-size:1.5vh;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(255,255,255,.55)}
.row.head .lbl::before{display:none}

#msg{position:absolute;top:50%;left:0;-webkit-transform:translateY(-50%);transform:translateY(-50%);
  font-family:'Manrope',sans-serif;font-weight:400;font-size:4vh;color:rgba(255,255,255,.8)}
#msg .msg-detail{font-family:'Manrope',sans-serif;font-weight:400;font-size:2vh;line-height:1.8;
  color:rgba(255,255,255,.6);margin-top:2.2vh}
#msg .msg-url{color:rgba(255,255,255,.75)}

/* In the lane the rows leave clear on the right, so neither the labels nor the
   values ever run underneath one. */
.more{position:absolute;right:0;font-family:'Manrope',sans-serif;font-size:2.4vh;
  color:rgba(255,255,255,.50);opacity:0;transition:opacity .2s;pointer-events:none}
.more.on{opacity:1}
#moreUp{top:0}
#moreDown{bottom:0}

/* Shown briefly after an action so a press that changes something off-screen
   (opening the service menu, scheduling a refresher) still acknowledges. */
#flash{position:absolute;right:8vw;bottom:5vh;font-family:'Manrope',sans-serif;font-weight:400;
  font-size:2.2vh;color:rgba(255,255,255,.85);opacity:0;transition:opacity .3s}
#flash.on{opacity:1}

/* ---- light theme ---- */
body.light, html.light{background:#f5f5f5;color:#111}
body.light #clock{color:#000;opacity:.7}
body.light #mark{color:#000}
body.light .tab{color:rgba(0,0,0,.52)}
body.light .tab.on{color:#000;font-weight:600}
body.light #hint{border-left-color:rgba(0,0,0,.15)}
body.light .h-title{color:#000}
body.light .h-body{color:rgba(0,0,0,.78)}
body.light .h-warn{color:rgba(0,0,0,.82);border-left-color:#b45309}
body.light .h-act{color:#15803d}
body.light .h-act.ro{color:rgba(0,0,0,.50)}
body.light .h-qr svg{border:1px solid rgba(0,0,0,.15)}
body.light .h-url{color:rgba(0,0,0,.65)}
body.light .row{opacity:.62}
body.light .row.sel{opacity:1}
body.light .row.sel .lbl{color:#000;font-weight:600}
body.light .val{color:rgba(0,0,0,.70)}
body.light .row.sel .val{color:rgba(0,0,0,.92);font-weight:600}
body.light .val.on{color:#15803d}
body.light .val.off{color:rgba(0,0,0,.48)}
body.light .val.bad{color:#dc2626}
body.light .val.warn{color:#b45309}
body.light .val.st.good{color:#15803d}
body.light .val.st.hold{color:#b45309}
body.light .val.st.note{color:rgba(0,0,0,.55)}
body.light .val.st.bad{color:#b91c1c}
body.light .val.act{color:rgba(0,0,0,.52)}
body.light .row.sel .val.act{color:#15803d}
body.light .row.sel .val.bad{color:#dc2626}
body.light .row.sel .val.warn{color:#b45309}
body.light .row.doable .lbl::before{background:rgba(0,0,0,.38)}
body.light .row.doable.sel .lbl::before{background:#15803d}
body.light .lbl .ic{background:rgba(0,0,0,.08)}
body.light .lbl .ver{color:rgba(0,0,0,.55)}
body.light .lbl .bdg{color:#b45309}
body.light .row.head .lbl{color:rgba(0,0,0,.62)}
body.light #msg{color:rgba(0,0,0,.8)}
body.light #msg .msg-detail{color:rgba(0,0,0,.65)}
body.light #msg .msg-url{color:rgba(0,0,0,.85)}
body.light .more{color:rgba(0,0,0,.50)}
body.light #flash{color:rgba(0,0,0,.88)}
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div id="clock">--:--</div>
    <!-- docs/logo/glasshouse.svg without its tile. -->
    <svg id="mark" viewBox="124 104 264 302" role="img" aria-label="Glasshouse" translate="no"><path d="M358 214 L256 134 L154 214 V342 A34 34 0 0 0 188 376 H324 A34 34 0 0 0 358 342 V286 H272" fill="none" stroke="currentColor" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <nav id="tabs"></nav>
  <div id="main">
    <div id="list">
      <div id="msg"></div>
      <div class="more" id="moreUp">&#9650;</div>
      <div id="rows"></div>
      <div class="more" id="moreDown">&#9660;</div>
    </div>
    <aside id="hint">
      <div class="h-title" id="hintTitle"></div>
      <div class="h-body" id="hintBody"></div>
      <div class="h-warn" id="hintWarn"></div>
      <div class="h-act" id="hintAct"></div>
      <div class="h-qr" id="hintQr"><svg id="hintQrSvg" viewBox="0 0 33 33" shape-rendering="crispEdges"></svg><div class="h-url" id="hintUrl"></div></div>
    </aside>
  </div>
  <div id="flash"></div>
</div>
<script src="/assets/qr.js"></script>
<script src="/assets/i18n.js"></script>
<script>
/* webOS 2.x runs WebKit 538.2, which has neither fetch nor Promise (ES6): on a
   55UH600V the page threw ReferenceError on new Promise, so the clock stuck at
   --:-- and tabs never rendered (#746). Minimal ES5 Promise covering what this
   page and the fetch polyfill below need. */
if (!window.Promise) {
  (function () {
    function Promise(fn) {
      var state = 'pending';
      var val = undefined;
      var handlers = [];

      function resolve(v) {
        if (state !== 'pending') return;
        if (v && (typeof v === 'object' || typeof v === 'function')) {
          var then;
          try { then = v.then; } catch (e) { return reject(e); }
          if (typeof then === 'function') {
            var called = false;
            try {
              then.call(v, function (y) {
                if (called) return;
                called = true;
                resolve(y);
              }, function (r) {
                if (called) return;
                called = true;
                reject(r);
              });
            } catch (e) {
              if (!called) reject(e);
            }
            return;
          }
        }
        state = 'fulfilled';
        val = v;
        run();
      }

      function reject(err) {
        if (state !== 'pending') return;
        state = 'rejected';
        val = err;
        run();
      }

      function run() {
        if (state === 'pending') return;
        setTimeout(function () {
          while (handlers.length) {
            var h = handlers.shift();
            var cb = state === 'fulfilled' ? h.onFulfilled : h.onRejected;
            if (!cb) {
              if (state === 'fulfilled') h.resolve(val);
              else h.reject(val);
              continue;
            }
            try {
              var res = cb(val);
              h.resolve(res);
            } catch (e) {
              h.reject(e);
            }
          }
        }, 0);
      }

      this.then = function (onFulfilled, onRejected) {
        return new Promise(function (nextResolve, nextReject) {
          handlers.push({
            onFulfilled: typeof onFulfilled === 'function' ? onFulfilled : null,
            onRejected: typeof onRejected === 'function' ? onRejected : null,
            resolve: nextResolve,
            reject: nextReject
          });
          run();
        });
      };

      this['catch'] = function (onRejected) {
        return this.then(null, onRejected);
      };

      try {
        fn(resolve, reject);
      } catch (e) {
        reject(e);
      }
    }

    Promise.resolve = function (v) {
      return new Promise(function (res) { res(v); });
    };

    Promise.reject = function (err) {
      return new Promise(function (res, rej) { rej(err); });
    };

    Promise.all = function (arr) {
      return new Promise(function (resolve, reject) {
        if (!arr || !arr.length) return resolve([]);
        var results = new Array(arr.length);
        var remaining = arr.length;
        for (var i = 0; i < arr.length; i++) {
          (function (idx) {
            Promise.resolve(arr[idx]).then(function (res) {
              results[idx] = res;
              remaining--;
              if (remaining === 0) resolve(results);
            }, reject);
          })(i);
        }
      });
    };

    window.Promise = Promise;
    if (typeof Promise === 'undefined') {
      try { Promise = window.Promise; } catch (e) {}
    }
  })();
}

/* webOS 3.x runs Chromium 38, which has Promise but not fetch (Chrome 42): on a
   58UH635V the page drew its header and loaded nothing. This covers what the
   page asks of fetch, over XMLHttpRequest, which i18n.js already tags with the
   page's language. */
if (!window.fetch) {
  window.fetch = function (url, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      var x = new XMLHttpRequest();
      x.open(opts.method || 'GET', url, true);
      var h = opts.headers || {};
      for (var k in h) {
        if (Object.prototype.hasOwnProperty.call(h, k)) x.setRequestHeader(k, h[k]);
      }
      if (opts.cache === 'no-store') x.setRequestHeader('Cache-Control', 'no-cache');
      x.onload = function () {
        var text = x.responseText;
        resolve({
          ok: x.status >= 200 && x.status < 300,
          status: x.status,
          text: function () { return Promise.resolve(text); },
          json: function () { return new Promise(function (ok) { ok(JSON.parse(text)); }); }
        });
      };
      x.onerror = x.ontimeout = function () { reject(new TypeError('network request failed')); };
      x.send(opts.body === undefined ? null : opts.body);
    });
  };
  if (typeof fetch === 'undefined') {
    try { fetch = window.fetch; } catch (e) {}
  }
}

/* Every section reads an endpoint the server already serves to the browser
   dashboard, so nothing here needs its own API. A section is a tab; its rows
   are built from that payload by its own builder below. */
var TABS = [
  // Metrics keeps the key it had as System, which the installed app opens on.
  { key: 'system',  label: t('tab.metrics', 'Metrics'),      url: '/api/stats',       build: sysRows,  poll: 5000 },
  { key: 'apps',    label: t('tab.apps', 'Apps'),         url: '/api/apps',        build: appsRows },
  { key: 'oled',    label: t('tab.oledCare', 'OLED Care'),    url: '/api/oledcare',    build: oledRows, optional: true },
  { key: 'game',    label: t('tab.game', 'Game'),         url: '/api/game',        build: gameRows, optional: true },
  { key: 'audio',   label: t('tab.audio', 'Audio'),        url: '/api/audio?with=settings', build: audioRows, poll: 8000 },
  { key: 'saver',   label: t('tv.tab.screenSaver', 'Screen Saver'), url: '/api/screensaver', build: saverRows, optional: true },
  { key: 'home',    label: t('tab.home', 'Home'),         url: '/api/home?with=catalogue,channels,lghome', build: homeRows, optional: true },
  { key: 'privacy', label: t('tab.privacy', 'Privacy'),      url: '/api/privacy',     build: privacyRows },
  { key: 'service', label: t('tv.tab.serviceMenu', 'Service Menu'), url: '/api/servicemenu', build: svcRows },
  { key: 'options', label: t('tv.tab.system', 'System'),       url: '/api/stats?with=settings', build: optionRows, poll: 5000 },
  { key: 'update',  label: t('tv.tab.updates', 'Updates'),      url: '/api/update',      build: updateRows },
  { key: 'settings', label: t('tv.tab.settings', 'Settings'),    url: '/api/setup',       build: settingsRows }
];

var tab = 0, sel = 0, busy = false, ROW_VH = 7.6, TALL_VH = 10.2, HEAD_VH = 5.4;
var initialSel = null;
/* Where a phone can reach this server. Only the server knows it - the app is
   served from localhost - so it is asked for once and kept. */
var lanOrigin = null, lanKey = null;
// allowPower in config.json; without it the server refuses Power off and Reboot, so they are not offered.
var allowPower = false;
// 12-hour time on this clock, as the TV's own setting has it (the server's lib/clock).
var clockHour12 = false;
// Ticks since caps were read again, for the hour cycle to be noticed on an open page.
var capsTicks = 0;
// The server version this page came from. webOS keeps the app's page in
// memory, and on a B8 (webOS 4.4) it came back without webOSRelaunch, so a
// fix the server installed did not show until the TV restarted.
var pageVersion = null;
function reloadPage() {
  location.replace(location.pathname + '?tab=' + T().key + '&t=' + Date.now());
}
function refreshCaps() {
  fetch('/api/caps', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.version) {
        if (pageVersion === null) pageVersion = d.version;
        else if (d.version !== pageVersion) return reloadPage();
      }
      // A new install walks through setup first - but only in the TV app: a
      // phone's browser cannot use those screens. The ?setup=1 or ?emulate-setup=1
      // query parameter allows testing the setup wizard from any browser.
      var emulateParam = location.search.indexOf('setup=') !== -1 || location.search.indexOf('emulate-setup') !== -1;
      if (d && ((d.setupNeeded && window.PalmSystem) || emulateParam)) {

// A second press within a few seconds, for what changes the TV's Home or removes something.
function confirmFirst(r, again, warn) {
  if (r.confirming) { r.confirming = false; return false; }
  r.confirming = true;
  r.origValue = r.value;
  r.origPress = r.press;
  r.value = t('tv.confirm', 'Confirm?');
  r.press = again;
  if (warn) flash(warn);
  render();
  setTimeout(function () {
    if (r.confirming) { r.confirming = false; r.value = r.origValue; r.press = r.origPress; render(); }
  }, 5000);
  return true;
}

/*
 * The lists a Privacy row opens. They replace the tab's rows until Back, or
 * the first row, returns to it. A switch that changes the TV reloads the list,
 * since LG ties some consents together and one can take others with it.
 */
var SUBLISTS = { consents: consentRows, services: serviceRows, catalog: catalogRows, homeChannels: homeChannelRows };
var SUBTAB = { consents: 'privacy', services: 'privacy', catalog: 'apps', homeChannels: 'home' };
var sub = null, subFrom = 0;

function buildRows(section, d) {
  return (sub && SUBTAB[sub] === section.key) ? SUBLISTS[sub](d) : (section.build(d) || []);
}

function openSub(key) {
  subFrom = sel;
  sub = key;
  if (key === 'catalog') enterCatalog();
  rows = buildRows(T(), data[T().key]);
  sel = nextRow(firstSel());           // the first entry, past the way back
  render();
}

function closeSub() {
  if (sub === 'catalog') stopInstallPoll();
  sub = null;
  rows = T().build(data[T().key]) || [];
  sel = subFrom < rows.length ? subFrom : firstSel();
  render();
}

function nextRow(i) {
  do { i++; } while (i < rows.length && rows[i].head);
  return i < rows.length ? i : firstSel();
}

  return { label: t('tv.backRow.privacy', '‹ Privacy'), value: '', act: 'close', press: t('tv.backRow.privacy.press', 'Press OK or Back to return'),

function consentRows(d) {

  groups.forEach(function (g) {
    var inGroup = flags.filter(function (f) { return (f.group || 'unknown') === g[0]; });
    if (!inGroup.length) return;
    // Flags with no name and no agreement behind them are one row, not one

    var anon = g[0] === 'unknown' ? inGroup.filter(function (f) { return !f.settable && !f.documents; }) : [];

// ---- install apps (Homebrew Channel catalog) ----

/* The same flow as the browser dashboard: pick an app, the server downloads and
   checks it, the facts are shown here, and only OK on Install changes the TV.
   Each screen is a set of rows, so the remote moves through it like any list. */
var cat = { data: null, loading: false };
var inst = null;                 // the last status from the server
var instTimer = null, instOwn = false, instDismissed = null, instJob = null;
var instRoot = false, instReplace = false, instView = 'list';
var INST_BUSY = { downloading: 1, verifying: 1, installing: 1, elevating: 1 };

// Server errors start lower-case; a host name at the start keeps its case.
function sentence(text) {
  text = String(text || '');
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(?![\w-])/i.test(text)) return text;
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function fmtSize(n) {
  if (typeof n !== 'number' || n <= 0) return '';
  if (n < 1048576) return t('apps.install.kb', '{n} KB', { n: Math.round(n / 1024) });
  var mb = n / 1048576;
  return t('apps.install.mb', '{n} MB', { n: mb >= 10 ? Math.round(mb) : Math.round(mb * 10) / 10 });
}

function fmtMb(n) {
  return n > 0 && n < 524288 ? t('apps.install.mbUnder1', 'under 1 MB') : t('apps.install.mb', '{n} MB', { n: Math.round(n / 1048576) });
}

function stopInstallPoll() {
  if (instTimer) { clearTimeout(instTimer); instTimer = null; }
}

function enterCatalog() {
  loadCatalog(false);
  pollInstall();
}

function loadCatalog(force) {
  if (cat.loading) return;
  cat.loading = true;
  fetch('/api/apps/catalog' + (force ? '?force=1' : ''), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { cat.data = d; })
    .catch(function (e) { cat.data = { ok: false, apps: [], error: String((e && e.message) || e) }; })
    .then(function () { cat.loading = false; refreshCatalogView(); });
}

function installPost(path, body, done) {
  fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok || !j.ok) throw new Error(j.error || t('apps.install.failed', 'The install could not be started'));
        return j;
      });
    })
    .then(function (j) { done(null, j); })
    .catch(function (e) { done(e); });
}

function currentView() {
  if (!inst) return 'list';
  if (INST_BUSY[inst.state]) return 'busy';
  if (inst.state === 'awaiting-confirm' && inst.preview) return 'preview';
  if ((inst.state === 'installed' || inst.state === 'error' || inst.state === 'interrupted') &&
      instOwn && inst.jobId !== instDismissed) return 'result';
  return 'list';
}

function pollInstall() {
  stopInstallPoll();
  fetch('/api/apps/install/status', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (s) {
      if (sub !== 'catalog') return;
      if (!s || !s.ok) throw new Error('status');
      var was = inst;
      inst = s;
      if (INST_BUSY[s.state] || s.state === 'awaiting-confirm') instOwn = true;
      if (s.state === 'awaiting-confirm' && s.jobId !== instJob) { instJob = s.jobId; instRoot = false; instReplace = false; }
      refreshCatalogView();
      if (INST_BUSY[s.state]) instTimer = setTimeout(pollInstall, 1000);
      else if (s.state === 'awaiting-confirm') instTimer = setTimeout(pollInstall, 5000);   // the preview expires
      if (was && (INST_BUSY[was.state] || was.state === 'awaiting-confirm') &&
          !INST_BUSY[s.state] && s.state !== 'awaiting-confirm') {
        loadCatalog(true);
        refreshApps();
      }
    })
    .catch(function () {
      // The server may be restarting; keep asking while a job was ours.
      if (sub === 'catalog' && instOwn) instTimer = setTimeout(pollInstall, 2000);
    });
}

// The Apps tab's own list changes once an app is installed, so its data is
// reloaded for when the catalog is left.
function refreshApps() {
  fetch('/api/apps', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { data.apps = d; })
    .catch(function () {});
}

/* Rebuild the catalog screens after new data. The selection stays on the same
   row while the screen is the same, and starts at the useful row when it changes. */
function refreshCatalogView() {
  if (sub !== 'catalog' || T().key !== 'apps') return;
  var keep = rows[sel] && rows[sel].key, before = instView;
  rows = catalogRows();
  sel = (instView === before && keep) ? rowIndex(keep) : -1;
  if (sel < 0 && instView === 'preview') sel = rowIndex('pv:go');
  if (sel < 0) sel = nextRow(firstSel());
  render();
}

function rowIndex(key) {
  for (var i = 0; i < rows.length; i++) if (rows[i].key === key) return i;
  return -1;
}

function titleSort(a, b) {
  var x = String(a.title || a.id).toLowerCase(), y = String(b.title || b.id).toLowerCase();
  return x < y ? -1 : x > y ? 1 : 0;
}

function catalogRow(a) {
  var sz = a.size ? fmtSize(a.size) : '';
  var verText = a.version ? 'v' + a.version : '';
  if (verText && sz) verText += ' · ' + sz;
  else if (sz) verText = sz;
  var row = { label: a.title || a.id, cat: true, key: a.id, icon: a.iconUri || '',
              ver: verText, badge: a.rootRequired ? t('apps.install.rootBadge', 'root') : '',
              hint: a.description || a.id };
  if (a.state === 'hbc') {
    row.value = t('apps.install.viaHbc', 'Updates through Homebrew Channel'); row.cls = 'off'; row.plain = true;
  } else if (a.state === 'installed') {
    row.value = t('apps.uninstall.button', 'Uninstall'); row.cls = 'bad'; row.act = 'uninstall';
    row.title = a.title || a.id;
    row.key = a.id;
    row.press = t('tv.apps.uninstall.press', 'Press OK to uninstall app');
  } else if (a.state === 'update') {
    row.value = t('apps.install.update', 'Update'); row.cls = 'warn'; row.act = 'catalogInstall';
    row.press = t('tv.apps.install.press.update', 'Press OK to review and update');
    if (a.installedVersion) row.hint += ' (' + t('apps.install.have', 'installed: v{version}', { version: a.installedVersion }) + ')';
  } else {
    row.value = t('apps.install.button', 'Install'); row.cls = 'act'; row.act = 'catalogInstall';
    row.press = t('tv.apps.install.press.install', 'Press OK to review and install');
  }
  return row;
}

function catalogRows() {
  instView = currentView();
  if (instView === 'preview') return previewRows(inst.preview);
  if (instView === 'busy') return progressRows(inst);
  if (instView === 'result') return resultRows(inst);
  var r = [backRowApps()];
  var d = cat.data;
  if (!d) {
    r.push({ label: t('apps.install.loading', 'Loading the catalog…'), value: '', key: 'status',
             hint: t('tv.apps.install.loading.hint', 'The TV is fetching the list. This needs internet access.') });
    return r;
  }
  if (!d.ok) {
    r.push({ label: t('tv.apps.install.unavailable', 'Catalog unavailable'), value: t('tv.apps.install.retry', 'Retry'), cls: 'act',
             act: 'catalogRetry', key: 'retry', press: t('tv.apps.install.press.retry', 'Press OK to try again'),
             hint: t('apps.install.unavailable', 'The catalog could not be loaded. The TV needs internet access to reach it.') +
                   (d.error ? ' ' + sentence(d.error) : '') });
    return r;
  }
  var apps = (d.apps || []).slice().sort(titleSort), ups = [], rest = [], i;
  for (i = 0; i < apps.length; i++) (apps[i].state === 'update' ? ups : rest).push(apps[i]);
  if (ups.length) {
    r.push(head(t('tv.apps.install.head.updates', 'Updates available')));
    for (i = 0; i < ups.length; i++) r.push(catalogRow(ups[i]));
    r.push(head(t('tv.apps.install.head.all', 'All apps')));
  }
  for (i = 0; i < rest.length; i++) r.push(catalogRow(rest[i]));
  return r;
}

function progressText(s) {
  var p = s.progress || {};
  switch (s.state) {
    case 'downloading':
      return p.total ? t('apps.install.downloading.of', 'Downloading {done} of {total}', { done: fmtMb(p.bytes || 0), total: fmtMb(p.total) })
        : t('apps.install.downloading', 'Downloading… {done}', { done: fmtMb(p.bytes || 0) });
    case 'verifying': return t('apps.install.verifying', 'Checking the package…');
    case 'installing': return t('apps.install.installing', 'Installing…');
    case 'elevating': return t('apps.install.elevating', 'Setting up root access…');
  }
  return '';
}

function progressRows(s) {
  return [{ label: progressText(s), value: '', key: 'busy',
            hint: t('tv.apps.install.busy.hint', 'This can take a minute or two. Back works again when it finishes.') }];
}

function resultRows(s) {
  var r = s.result || {};
  if (s.state === 'installed') {
    return [{ label: t('apps.install.done', 'Installed {name} v{version}.', { name: r.title || r.package || '', version: r.version || '' }),
              value: t('tv.apps.install.dismiss.done', 'Done'), cls: 'act', act: 'instDone', key: 'done',
              press: t('tv.apps.install.press.done', 'Press OK to return to the catalog'),
              hint: t('tv.apps.install.done.hint', 'The app is on the TV now.') }];
  }
  return [{ label: t('tv.apps.install.error', 'The install failed'),
            value: t('tv.apps.install.dismiss.error', 'Dismiss'), cls: 'bad', act: 'instDone', key: 'done',
            press: t('tv.apps.install.press.done', 'Press OK to return to the catalog'),
            hint: sentence(s.error || t('common.unknownError', 'unknown error')) }];
}

function toggleRow(label, on, act, key, hint) {
  return { label: label, value: on ? t('common.on', 'On') : t('common.off', 'Off'), cls: on ? 'on' : 'off', act: act, key: key,
           press: on ? t('tv.apps.install.press.off', 'Press OK to switch off') : t('tv.apps.install.press.on', 'Press OK to switch on'),
           hint: hint };
}

function previewRows(pv) {
  var dir = pv.direction, ver = pv.version, from = pv.installedVersion, r = [];
  var first = pv.apps && pv.apps[0] && pv.apps[0].title;
  r.push(head(first || pv.package));
  r.push({ label: t('tv.apps.install.pv.change', 'Change'), key: 'pv:change', hint: pv.package,
    value: pv.storeInstalled && from ? t('apps.install.dir.store', 'v{version}, in place of the LG store\'s v{from}', { from: from, version: ver })
      : dir === 'up' ? t('apps.install.dir.up', 'upgrade from v{from} to v{version}', { from: from, version: ver })
      : dir === 'down' ? t('apps.install.dir.down', 'downgrade from v{from} to v{version}', { from: from, version: ver })
      : dir === 'same' ? t('apps.install.dir.same', 'reinstall of v{version}', { version: ver })
      : t('apps.install.dir.new', 'new install of v{version}', { version: ver }) });
  var ids = [], i;
  for (i = 0; i < (pv.apps || []).length; i++) ids.push(pv.apps[i].id);
  if (ids.length > 1) {
    r.push({ label: t('tv.apps.install.pv.apps', 'Apps'), value: String(ids.length), key: 'pv:apps',
             hint: t('apps.install.apps', 'Apps: {list}', { list: ids.join(', ') }) });
  }
  var svc = pv.services || [];
  if (svc.length) {
    r.push({ label: t('tv.apps.install.pv.services', 'Services'), value: String(svc.length), key: 'pv:services',
             hint: t('apps.install.services', 'Background services: {list}', { list: svc.join(', ') }) });
    // Root for a package the Homebrew Channel has not vetted is only offered
    // where it can be confirmed by name, which the remote cannot do.
    if (pv.vetted) {
      r.push(toggleRow(t('apps.install.root', 'Run services as root (needs the Homebrew Channel)'), instRoot, 'instRoot', 'pv:root',
               pv.rootRequired ? t('tv.apps.install.root.needed', 'This app asks for its services to run as root, and may not work without it.')
                                     : t('tv.apps.install.root.hint', 'Off unless the app needs it. Root access is set up through the Homebrew Channel.')));
    }
    // An update to an app that had root gets it back without the toggle on.
    if ((pv.reelevate || []).length) {
      r.push({ label: t('tv.apps.install.pv.root', 'Root'), value: t('tv.apps.install.pv.rootBack', 'Given back'), cls: 'warn', key: 'pv:rootback',
               hint: t('apps.install.root.restored', 'Root is given back to {list} after this update, as before.', { list: pv.reelevate.join(', ') }) });
    }
  }
  if (pv.cpuMismatch) {
    r.push({ label: t('tv.apps.install.pv.cpu', 'Processor'), value: t('tv.apps.install.pv.mismatch', 'Mismatch'), cls: 'warn', key: 'pv:cpu',
             hint: t('apps.install.cpu', 'Its programs are built for a different processor than this TV\'s and may not run.') });
  }
  if (pv.isScreensaver) {
    r.push({ label: t('tv.apps.install.pv.screensaver', 'Screen saver'), value: t('common.replaces', 'Replaces ours'), cls: 'warn', key: 'pv:screensaver',
             hint: t('apps.install.screensaver.warn', 'This app installs a custom screen saver, which will replace Glasshouse’s own screen savers.') });
  }
  if (pv.freeBytes !== null && pv.freeBytes !== undefined) {
    r.push({ label: t('tv.apps.install.pv.space', 'Free space'), value: fmtMb(pv.freeBytes), key: 'pv:space',
             hint: t('apps.install.space', 'Free space: {free}. Needed: about {need}.', { free: fmtMb(pv.freeBytes), need: fmtMb(pv.needBytes) }) });
  }
  if (pv.storeInstalled) {
    r.push(toggleRow(t('apps.install.store.replace', 'Replace the store version'), instReplace, 'instReplace', 'pv:replace',
             t('apps.install.store.warn', 'This app was installed from the LG store. Replacing it stops store updates for it.')));
  }
  r.push({ label: t('apps.install.confirm', 'Install'), value: '', cls: 'act', act: 'instConfirm', key: 'pv:go',
           press: t('tv.apps.install.press.go', 'Press OK to install now'),
           hint: t('tv.apps.install.go.hint', 'Nothing is installed until OK is pressed here.') });
  r.push({ label: t('common.cancel', 'Cancel'), value: '', cls: 'act', act: 'instCancel', key: 'pv:cancel',
           press: t('tv.apps.install.press.cancel', 'Press OK to discard the download'),
           hint: t('tv.apps.install.cancel.hint', 'The downloaded package is deleted.') });
  return r;
}

function adoptInstall(status) {
  inst = status;
  refreshCatalogView();
  pollInstall();
}

function startInstall(id) {
  if (busy || currentView() !== 'list') return;
  busy = true;
  instOwn = true;
  instDismissed = null;
  installPost('/api/apps/install/fetch', { id: id, auto: true }, function (err, j) {
    busy = false;
    if (err) { instOwn = false; flash(sentence(err.message)); return; }
    adoptInstall(j.install);
  });
}

function confirmInstall() {
  if (busy || !inst || inst.state !== 'awaiting-confirm' || !inst.preview) return;
  if (inst.preview.storeInstalled && !instReplace) {
    flash(t('tv.apps.install.store.needOn', 'Switch on Replace the store version first.'));
    return;
  }
  busy = true;
  installPost('/api/apps/install/confirm', { jobId: inst.jobId, elevate: instRoot && inst.preview.vetted, replaceStore: instReplace }, function (err, j) {
    busy = false;
    if (err) { flash(sentence(err.message)); pollInstall(); return; }
    adoptInstall(j.install);
  });
}

function cancelInstall() {
  if (busy || !inst) return;
  busy = true;
  installPost('/api/apps/install/cancel', { jobId: inst.jobId }, function (err) {
    busy = false;
    if (err) flash(sentence(err.message));
    instOwn = false;
    inst = null;
    refreshCatalogView();
    pollInstall();
  });
}

function dismissResult() {
  instDismissed = inst && inst.jobId;
  instOwn = false;
  refreshCatalogView();
}

/* Back and Left: on the preview they discard it, while an install runs they
   do nothing (it cannot be stopped), and elsewhere they step out as usual. */
function backOut() {
  if (sub !== 'catalog') return closeSub();
  var v = currentView();
  if (v === 'preview') return cancelInstall();
  if (v === 'busy') return flash(t('tv.apps.install.wait', 'An install is running. Please wait.'));
  if (v === 'result') return dismissResult();
  closeSub();
}

// ---- rendering ----

function rowHeight(r) { return (r && r.head ? HEAD_VH : isTall(r) ? TALL_VH : ROW_VH) * window.innerHeight / 100; }

// A row's smaller lines under its value: sub is one, or a list of them.
function subLines(r) { return r && r.sub ? [].concat(r.sub) : []; }

function isTall(r) { return subLines(r).length > 1; }

function render() {
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  if (!rows.length) {
    box.innerHTML = '';
    msg.style.display = 'block';
    var d = data[T().key];
    if (!d) {
      msg.innerHTML = esc(t('tv.loading', 'Loading…'));
    } else if (d.error) {
      var detail = '<div class="msg-detail">' + esc(d.error);
      if (lanOrigin) detail += '<br>' + esc(t('tv.msg.useWeb', 'Use the web dashboard instead:')) + ' <span class="msg-url">' + esc(lanOrigin) + '</span>';
      detail += '<br>' + esc(t('tv.msg.issue', 'If this persists, open an issue at github.com/rorygallagher2024/glasshouse')) +
                '<br>' + esc(t('tv.msg.includeError', 'and include the error:')) + ' <span class="msg-url">' + esc(d.error) + '</span></div>';
      msg.innerHTML = esc(t('tv.msg.wentWrong', 'Something went wrong')) + detail;
    } else {
      msg.innerHTML = esc(t('tv.msg.nothing', 'Nothing to show here'));
    }
    return;
  }
  msg.style.display = 'none';
  box.innerHTML = rows.map(function (r, i) {
    if (r.head) return '<div class="row head"><span class="lbl">' + esc(r.label) + '</span></div>';
    return '<div class="row' + (i === sel ? ' sel' : '') + (r.act ? ' doable' : '') + (r.cat ? ' cat' : '') + (isTall(r) ? ' tall' : '') + '" onclick="pickRow(' + i + ')">' +
             '<span class="lbl">' + labelHtml(r, i) + '</span>' +
             '<span class="val' + valClass(r) + '">' + esc(r.value) +
               subLines(r).map(function (line) { return '<span class="sub">' + esc(line) + '</span>'; }).join('') + '</span>' +
           '</div>';
  }).join('');
  position();
  renderHint();
}

/* Catalog rows add an icon, version and badge to the label. The icon is only
   drawn near the selection, so moving through a long catalog does not reload
   hundreds of remote images each time the list is redrawn. */
function labelHtml(r, i) {
  var h = '';
  if (r.cat) {
    h += (r.icon && Math.abs(i - sel) <= 10)
      ? '<img class="ic" src="' + esc(r.icon) + '" referrerpolicy="no-referrer" alt="" onerror="this.style.visibility=\'hidden\'">'
      : '<span class="ic none"></span>';
  }
  h += esc(r.label);
  if (r.ver) h += '<span class="ver">' + esc(r.ver) + '</span>';
  if (r.badge) h += '<span class="bdg">' + esc(r.badge) + '</span>';
  return h;
}

/*
 * A row that cannot be pressed but reports a coloured state is a read-out, so
 * it takes the status label rather than the coloured value the toggles use:
 * otherwise "Capture: Stopped" looks exactly like a switch set to Stopped.
 */
var STATUS_OF = { on: 'good', warn: 'hold', bad: 'bad', off: 'note' };

function valClass(r) {
  if (!r.cls) return '';
  // A version number is a reading, and would not survive the capitals.
  if (!r.act && !r.plain && STATUS_OF[r.cls]) return ' st ' + STATUS_OF[r.cls];
  return ' ' + r.cls;
}

/*
 * The explainer for the selected row. Rows carry their own text; where one has
 * none the panel still says whether OK does anything, because that is the part
 * a reader cannot work out by looking.
 */
function renderHint() {
  var el = document.getElementById('hint');
  var r = rows[sel];
  if (!r || r.head) { el.className = ''; return; }
  document.getElementById('hintTitle').textContent = r.label;
  // The scan prompt is added only when there is a code to scan.
  document.getElementById('hintBody').textContent =
    (r.hint || '') + (renderQr(r) && r.scan ? ' ' + r.scan : '');
  var warn = document.getElementById('hintWarn');
  warn.textContent = r.warn || '';
  warn.className = 'h-warn' + (r.warn ? ' on' : '');
  var act = document.getElementById('hintAct');
  act.textContent = r.act ? (r.press || t('tv.press.change', 'Press OK to change')) : t('tv.viewOnly', 'View only');
  act.className = 'h-act' + (r.act ? '' : ' ro');
  el.className = 'on';
}

/* A row marked `web` can only be changed in a browser, so it offers a code to
   scan rather than an address to type on a remote. Drawn as one path of dark
   modules; an unreachable address or an over-long URL simply shows nothing. */
function renderQr(r) {
  var box = document.getElementById('hintQr');
  if (!r.web || !lanOrigin) { box.className = 'h-qr'; return false; }
  var url = lanOrigin + (r.web === true ? '/' : r.web);
  // The code carries the token so the phone can use the page; the address
  // printed beneath it leaves it out.
  var scan = lanKey ? url + (url.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(lanKey) : url;
  if (!qrDraw(document.getElementById('hintQrSvg'), scan)) { box.className = 'h-qr'; return false; }
  document.getElementById('hintUrl').textContent = url.replace(/^https?:\/\//, '');
  box.className = 'h-qr on';
  return true;
}

/* Headings are not landing places, so the selection skips over them and the
   offset is summed from real row heights rather than multiplied.
   The list is anchored to the top and only starts scrolling once the selection
   passes the middle, so a short section fills the screen from the top instead
   of floating in the centre with half the screen empty. */
function position() {
  var list = document.getElementById('list');
  if (!list.clientHeight) list.style.height = document.getElementById('main').clientHeight + 'px';
  var off = 0, total = 0, i;
  for (i = 0; i < rows.length; i++) {
    if (i < sel) off += rowHeight(rows[i]);
    total += rowHeight(rows[i]);
  }
  var centre = list.clientHeight / 2 - rowHeight(rows[sel]) / 2;
  var y = centre - off;
  var floor = Math.min(0, list.clientHeight - total);   // never scroll past the last row
  if (y > 0) y = 0;
  if (y < floor) y = floor;
  var rowsEl = document.getElementById('rows');
  rowsEl.style.webkitTransform = rowsEl.style.transform = 'translateY(' + y + 'px)';
  document.getElementById('moreUp').className = 'more' + (y < 0 ? ' on' : '');
  document.getElementById('moreDown').className = 'more' + (y > floor ? ' on' : '');
}

function firstSel() {
  for (var i = 0; i < rows.length; i++) if (!rows[i].head) return i;
  return 0;
}
function lastSel() {
  for (var i = rows.length - 1; i >= 0; i--) if (!rows[i].head) return i;
  return 0;
}

function move(d) {
  if (!rows.length) return;
  var i = sel;
  do { i += d; } while (i >= 0 && i < rows.length && rows[i].head);
  if (i < 0 || i >= rows.length) return;
  sel = i;
  render();
}

function page(d) {
  if (!rows.length) return;
  var target = sel;
  for (var count = 0; count < 6; count++) {
    var next = target;
    do { next += d; } while (next >= 0 && next < rows.length && rows[next].head);
    if (next < 0 || next >= rows.length) break;
    target = next;
  }
  if (target === sel) {
    if (d < 0) target = firstSel();
    else if (d > 0) target = lastSel();
  }
  if (target !== sel && !rows[target].head) {
    sel = target;
    render();
  }
}

function pickRow(i) {
  if (i < 0 || i >= rows.length || rows[i].head) return;
  if (sel === i && rows[i].act) activate();
  else { sel = i; render(); }
}

function renderTabs() {
  var bar = document.getElementById('tabs');
  bar.innerHTML = TABS.map(function (section, i) {
    return '<div class="tab' + (i === tab ? ' on' : '') + '" data-label="' + esc(section.label) + '" onclick="openTab(' + i + ')">' +
      esc(section.label) + '</div>';
  }).join('');
  // More tabs than fit across the screen: scroll the bar to keep the selected
  // one in view, and fade whichever edge has tabs hidden beyond it.
  var on = bar.children[tab];
  var left = on.getBoundingClientRect().left - bar.getBoundingClientRect().left + bar.scrollLeft;
  if (left < bar.scrollLeft) bar.scrollLeft = left;
  else if (left + on.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = left + on.offsetWidth - bar.clientWidth;
  bar.className = (bar.scrollLeft > 0 ? 'clip-l ' : '') +
    (bar.scrollLeft + bar.clientWidth < bar.scrollWidth - 1 ? 'clip-r' : '');
}

function flash(text) {
  var el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'on';
  if (flashTimer) clearTimeout(flashTimer);
  // Long enough to read: a sentence of advice needs more than a short confirmation.
  flashTimer = setTimeout(function () { el.className = ''; }, Math.max(2400, String(text).length * 55));
}

// ---- data ----

function fetchTab(keepSel) {
  var section = T(), key = section.key, view = sub;
  fetch(section.url, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (T().key !== key || sub !== view) return; // the user moved on while this was in flight
      data[key] = d;
      rows = buildRows(section, d);
      if (initialSel !== null && initialSel < rows.length && (!rows[initialSel] || !rows[initialSel].head)) {
        sel = initialSel;
        initialSel = null;
      } else if (!keepSel || sel >= rows.length || (rows[sel] && rows[sel].head)) {
        sel = firstSel();
      }
      render();
    })
    .catch(function () {
      if (T().key !== key || sub !== view) return;
      if (key === 'audio') {
        data.audio = { ok: false, error: t('tv.msg.noResponse', 'The dashboard’s server on this TV did not respond.') };
        rows = buildRows(section, data.audio);
        sel = firstSel();
        return render();
      }
      if (rows.length) return;
      document.getElementById('rows').innerHTML = '';
      var msg = document.getElementById('msg');
      msg.style.display = 'block';
      var detail = '<div class="msg-detail">' + esc(t('tv.msg.noResponse', 'The dashboard’s server on this TV did not respond.'));
      if (lanOrigin) detail += '<br>' + esc(t('tv.msg.useWeb', 'Use the web dashboard instead:')) + ' <span class="msg-url">' + esc(lanOrigin) + '</span>';
      detail += '<br>' + esc(t('tv.msg.issue', 'If this persists, open an issue at github.com/rorygallagher2024/glasshouse')) + '</div>';
      msg.innerHTML = esc(t('tv.msg.unreachable', 'Could not reach the TV server')) + detail;
    });
}

function openTab(i, keepSel) {
  if (timer) { clearInterval(timer); timer = null; }
  stopInstallPoll();
  tab = i;
  sub = null;
  if (!keepSel) sel = 0;
  rows = [];
  renderTabs();
  var cached = data[T().key];
  if (cached) {
    rows = T().build(cached) || [];
    if (!keepSel) sel = firstSel();
  }
  render();
  fetchTab(keepSel || !!cached);
  if (T().poll) timer = setInterval(function () { fetchTab(true); }, T().poll);
  if (T().key === 'update') checkUpdateOnOpen();
}

function checkUpdateOnOpen() {
  var d = data.update;
  if (busy || (d && d.writable === false) || (d && d.attemptedMs !== null && d.attemptedMs < 120000)) return;
  fetch('/api/control', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'updateCheck', value: 'open' })
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      if (T().key === 'update' && res && res.ok) {
        data.update = res;
        rows = updateRows(res) || [];
        render();
      }
    }).catch(function () {});
}

function switchTab(d) {
  var n = tab + d;
  if (n < 0 || n >= TABS.length) return;
  openTab(n);
}

// ---- actions ----

function awaitRestart(targetVer, doneLabel) {
  busy = true;
  var box = document.getElementById('rows'), msg = document.getElementById('msg');
  box.innerHTML = '';
  msg.style.display = 'block';
  msg.innerHTML = esc(t('tv.update.installingUpdate', 'Installing update…')) + '<div class="msg-detail">' + esc(t('tv.update.restartWait', 'The TV server is restarting. Please wait…')) + '</div>';

  var attempts = 0;
  var poll = setInterval(function () {
    attempts++;
    fetch('/api/update', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          if (!targetVer || d.installed === targetVer) {
            clearInterval(poll);
            busy = false;
            flash(doneLabel || t('tv.update.complete', 'Update complete'));
            setTimeout(function () {
              location.replace(location.pathname + '?tab=update&t=' + Date.now());
            }, 1000);
          }
        }
      })
      .catch(function () {});
    if (attempts > 80) {
      clearInterval(poll);
      busy = false;
      flash(t('tv.update.slow', 'Restart is taking longer than expected'));
      fetchTab(true);
    }
  }, 1500);
}

function send(body, note) {
  busy = true;
  fetch('/api/control', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) { flash(res.error || t('tv.failed', 'That did not work')); return fetchTab(true); }
      if (note) flash(note);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash(t('tv.failed', 'That did not work')); });
}

function sendPost(url, body, note) {
  busy = true;
  fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      busy = false;
      if (res && res.ok === false) { flash(res.error || t('tv.failed', 'That did not work')); return fetchTab(true); }
      if (note) flash(note);
      if (sub === 'catalog') loadCatalog(true);
      fetchTab(true);
    })
    .catch(function () { busy = false; flash(t('tv.failed', 'That did not work')); });
}

/*
 * Opening or closing the dashboard restarts the server to apply it, so wait for
 * it to answer again before showing the new state.
 */
function setNetwork(open) {
  busy = true;
  flash(open ? t('tv.net.opening', 'Opening it to your network…') : t('tv.net.closing', 'Keeping it to this TV…'));
  fetch('/api/setup', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'network', open: open })
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (res) {
      if (res && res.ok === false) { busy = false; flash(res.error || t('tv.failed', 'That did not work')); return; }
      setTimeout(function () { untilBack(30); }, 1500);
    })
    .catch(function () { busy = false; flash(t('tv.failed', 'That did not work')); });
}

function untilBack(tries) {
  fetch('/api/setup', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('not yet'); return r.json(); })
    .then(function () { busy = false; refreshCaps(); fetchTab(true); })
    .catch(function () {
      if (tries <= 0) { busy = false; flash(t('tv.net.notBack', 'It did not come back. Try again.')); return; }
      setTimeout(function () { untilBack(tries - 1); }, 1000);
    });
}

/*
 * The app declares disableBackHistoryAPI, so Back is delivered to this page
 * rather than handled by the system, and ignoring it left Back doing nothing.
 * There is no screen to step back to, so it leaves the app as Back does
 * everywhere else on the TV. platformBack is webOS's own Back; window.close
 * covers the page being opened somewhere other than the app.
 */
// Back only sends a webOS app to the background, and opening it again from the
// home screen resumes the page as it was. Reload instead, on the same tab, so
// a server updated in the meantime shows its current dashboard.
document.addEventListener('webOSRelaunch', reloadPage);
// Back in front by any other way, ask at once rather than at the next sixth tick.
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) refreshCaps();
});

function leaveApp() {
  if (window.PalmSystem && typeof window.PalmSystem.platformBack === 'function') {
    window.PalmSystem.platformBack();
  } else {
    window.close();
  }
}

/*
 * The screen saver ends on any button, and OK acts on the key going down: the
 * release of that same press reached it and ended it, 145ms after it showed
 * on a C2. So it starts once OK is let go, with a moment's grace, or after a
 * second if no release comes (a click, or a remote that sends none).
 */
var saverPending = null;
function startSaverAfterRelease() {
  if (saverPending) return;
  flash(t('tv.flash.startingSaver', 'Starting the screen saver…'));
  function go() {
    if (!saverPending) return;
    clearTimeout(saverPending);
    saverPending = null;
    setTimeout(function () { send({ action: 'screensaver' }); }, 300);
  }
  saverPending = setTimeout(go, 1000);
  document.addEventListener('keyup', function once() {
    document.removeEventListener('keyup', once);
    go();
  });
}

document.addEventListener('keydown', function (e) {
  var k = e.key, c = e.keyCode;

  // Inside a list opened from a row, Left goes back up to it rather than to
  // another tab, and Right has nowhere to go.
  if      (c === 37 || k === 'ArrowLeft')  { if (sub) backOut(); else switchTab(-1); e.preventDefault(); }
  else if (c === 39 || k === 'ArrowRight') { if (!sub) switchTab(1); e.preventDefault(); }
  else if (c === 38 || k === 'ArrowUp')    { move(-1);      e.preventDefault(); }
  else if (c === 40 || k === 'ArrowDown')  { move(1);       e.preventDefault(); }
  else if (c === 402 || c === 33 || k === 'ChannelUp' || k === 'PageUp' || k === 'VK_CHANNEL_UP')     { page(-1); e.preventDefault(); }
  else if (c === 403 || c === 34 || k === 'ChannelDown' || k === 'PageDown' || k === 'VK_CHANNEL_DOWN') { page(1);  e.preventDefault(); }
  else if (c === 13 || k === 'Enter')      { activate();    e.preventDefault(); }
  else if (c === 461 || k === 'GoBack' || k === 'BrowserBack') { if (sub) backOut(); else leaveApp(); e.preventDefault(); }
});

// The Magic Remote's wheel arrives as a wheel event, not a key, and the page
// itself never scrolls (overflow:hidden), so it moves the selection a row per
// notch as Up and Down do. Older engines only fire mousewheel, whose
// wheelDelta has the opposite sign to deltaY.
function onWheel(e) {
  var d = e.deltaY !== undefined ? e.deltaY : -e.wheelDelta;
  if (d) move(d > 0 ? 1 : -1);
  e.preventDefault();
}
document.addEventListener('onwheel' in document ? 'wheel' : 'mousewheel', onWheel);
window.addEventListener('resize', function () { if (rows.length) position(); });

renderTabs();
var initTab = 0;
var match = location.search.match(/[?&]tab=([^&]+)/);
if (match) {
  var wanted = decodeURIComponent(match[1]).toLowerCase();
  for (var ti = 0; ti < TABS.length; ti++) {
    if (TABS[ti].key === wanted) { initTab = ti; break; }
  }
}
var selMatch = location.search.match(/[?&]sel=([^&]+)/);
if (selMatch) {
  var pSel = parseInt(selMatch[1], 10);
  if (!isNaN(pSel)) {
    sel = pSel;
    initialSel = pSel;
  }
}
openTab(initTab, initialSel !== null);

/* A section the TV may not have is dropped once its endpoint says so, as the
   browser dashboard hides its tab: a B8 has no Game Optimizer, and an LCD TV
   has no OLED Care. */
TABS.forEach(function (section) {
  if (!section.optional) return;
  fetch(section.url, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var i = TABS.indexOf(section);
      if (!d || d.available !== false || i < 0) return;
      var cur = TABS[tab];
      TABS.splice(i, 1);
      tab = Math.max(0, TABS.indexOf(cur));
      renderTabs();
      if (cur === section) openTab(tab);
    })
    .catch(function () {});
});
</script>
</body>
