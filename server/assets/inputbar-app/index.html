<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glasshouse Inputs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* The window is an overlay: whatever is on the input shows through. */
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:sans-serif;color:#fff;cursor:default}
#shade{position:absolute;left:0;right:0;bottom:0;height:420px;opacity:0;
  background:-webkit-linear-gradient(top,rgba(0,0,0,0),rgba(0,0,0,.72));background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.72));
  -webkit-transition:opacity .18s ease-out;transition:opacity .18s ease-out}
#bar{position:absolute;left:0;right:0;bottom:72px;text-align:center;opacity:0;-webkit-transform:translateY(24px);transform:translateY(24px);
  -webkit-transition:opacity .18s ease-out,-webkit-transform .18s ease-out;transition:opacity .18s ease-out,transform .18s ease-out}
.on #shade,.on #bar{opacity:1}
.on #bar{-webkit-transform:none;transform:none}
/* Opening is at once: only closing fades. */
.on #shade,.on #bar{-webkit-transition:none;transition:none}
#tiles{display:inline-block;white-space:nowrap;font-size:0}
/*
 * Opaque by default, so stepping through inputs is drawn by the compositor
 * alone without repainting translucent tiles or shadows over the picture.
 */
.tile{display:inline-block;vertical-align:top;position:relative;width:336px;height:112px;margin:0 12px;padding:0 22px;border-radius:22px;text-align:left;
  background:#1e1e1e;color:#c8c8c8;border:2px solid #2e2e2e;
  -webkit-transition:-webkit-transform .1s ease-out;transition:transform .1s ease-out}
.tile.focus{background:#fff;color:#111;border-color:#fff;-webkit-transform:scale(1.06);transform:scale(1.06)}
.transparent .tile{background:#222;color:#fff;border:0;opacity:.75;box-shadow:0 0 0 2px rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.45);
  -webkit-transition:opacity .12s,-webkit-transform .12s,box-shadow .12s;transition:opacity .12s,transform .12s,box-shadow .12s}
.transparent .tile.focus{opacity:1;background:#fff;color:#111;box-shadow:0 0 0 5px #fff,0 14px 40px rgba(0,0,0,.6)}
.tile .head{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;height:100%}
.dico{-webkit-flex:0 0 auto;flex:0 0 auto;width:52px;height:52px;margin-right:18px}
.dico svg{display:block;width:100%;height:100%}
.txt{-webkit-flex:1 1 auto;flex:1 1 auto;min-width:0}
.nm{font-size:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path{font-size:18px;color:#9e9e9e;margin-top:4px;white-space:nowrap}
.focus .path{color:#555}
/* The input on screen now. */
.tile.now:after{content:"";position:absolute;left:50%;bottom:-26px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#30de61}
.tworow #shade{height:560px}
.tworow #bar{bottom:54px}
.tworow .tile{margin-top:16px;margin-bottom:16px}
.tworow .tile.now:after{bottom:-20px}
/*
 * The level bar (opened by a Brightness key), in one of three styles that the
 * Remote tab chooses between (body.osdlg, body.osdh or body.osdvp): a vertical
 * bar at the right edge, laid out like the TV's own volume bar (#osdv), or a
 * dark pill with an icon, a track and the number (#osd), low on the screen
 * (osdh) or upright at the right edge (osdvp).
 */
.osdlg #osd,.osdh #osdv,.osdvp #osdv{display:none}
/*
 * LG's volume bar (StarfishVolume.qml), as measured on a capture of it at
 * 1920 x 1080: a tube 18 wide and 552 high from y 263, its right edge 60 from
 * the screen's, a 1 px light outline round a dark inside (#262a2c over the
 * picture) and a fill of the same width, a thin + above it and - below, the
 * level in a light digit face with its right edge 54 from the tube, and the
 * icon (a sun of the same 4 px stroke and 36 px height as its speaker) before the digits.
 */
#osdv{position:absolute;right:57px;top:calc(50% - 1px);-webkit-transform:translateY(-50%);transform:translateY(-50%);
  display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;opacity:0;
  -webkit-transition:opacity .15s linear;transition:opacity .15s linear}
/* It appears at once and fades out over 150 ms (LG's fadeAnimationDuration); a cut out reads as a pop. */
.osdon #osdv{opacity:1;-webkit-transition:none;transition:none}
#osdv .vico{position:relative;top:1px;-webkit-flex:0 0 auto;flex:0 0 auto;width:36px;height:36px;margin-right:16px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7))}
#osdv .vico svg,#osdv .varrow svg{display:block;width:100%;height:100%}
#osdv .vnum{position:relative;top:1px;-webkit-flex:0 0 auto;flex:0 0 auto;margin-right:38px;text-align:right;font-family:"LG Smart UI",sans-serif;font-size:85px;line-height:1;font-weight:400;
  font-variant-numeric:tabular-nums;color:#e6e5e5;text-shadow:0 2.5px 8px rgba(0,0,0,.7)}
#osdv .vcol{-webkit-flex:0 0 auto;flex:0 0 auto;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
#osdv .varrow{width:24px;height:24px}
#osdv .vcol>.varrow:first-child{margin:0 0 10px}
#osdv .vcol>.varrow:last-child{margin:9px 0 0}
#osdv .vtrack{position:relative;box-sizing:border-box;width:18px;height:552px;border-radius:9px;border:1px solid #e5e9eb;background:rgba(55,58,65,.66)}
#osdv .vfill{position:absolute;left:-1px;bottom:2px;width:18px;height:0;border-radius:9px;background:#e4e7e6}
/* Centred, and as wide as its parts, which do not change with the level. */
#osd{position:absolute;left:50%;bottom:80px;height:80px;border-radius:40px;-webkit-transform:translateX(-50%);transform:translateX(-50%);
  background:rgba(34,34,36,.94);opacity:0;display:-webkit-flex;display:flex;
  -webkit-align-items:center;align-items:center;padding:0 32px;
  -webkit-transition:opacity .16s ease-out;transition:opacity .16s ease-out}
.osdon #osd{opacity:1}
/* Opening is at once: only closing fades. */
.osdon #osd{-webkit-transition:none;transition:none}
#osd .oico{-webkit-flex:0 0 auto;flex:0 0 auto;width:38px;height:38px;margin-right:24px}
#osd .oico svg{display:block;width:100%;height:100%}
#osd .otrack{-webkit-flex:0 0 460px;flex:0 0 460px;width:460px;height:11px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden}
#osd .ofill{height:100%;width:0;border-radius:6px;background:#fff}
/* Room for three digits whatever the level, so neither the pill nor the track changes size; the digits hug the right side. */
#osd .onum{-webkit-flex:0 0 auto;flex:0 0 auto;width:3ch;margin-left:24px;text-align:right;font-size:36px;font-weight:500;font-variant-numeric:tabular-nums;color:#fff}
/*
 * The same pill upright at the right edge, level with the volume bar's: the icon
 * on top, the track and the fill rising from its foot, and the number below.
 */
.osdvp #osd{left:auto;right:60px;bottom:auto;top:50%;width:80px;height:auto;-webkit-flex-direction:column;flex-direction:column;
  padding:32px 0;-webkit-transform:translateY(-50%);transform:translateY(-50%)}
.osdvp #osd .oico{margin:0 0 24px}
.osdvp #osd .otrack{position:relative;-webkit-flex:0 0 460px;flex:0 0 460px;width:11px;height:460px}
.osdvp #osd .ofill{position:absolute;left:0;bottom:0;width:100%;height:0}
.osdvp #osd .onum{width:3ch;margin:24px 0 0;text-align:center}
</style>
</head>
<body>
<div id="shade"></div>
<div id="bar"><div id="tiles"></div></div>
<div id="osdv"><div class="vico"><svg viewBox="0 0 36 36" fill="none" stroke="#e6e5e5" stroke-width="4"><circle cx="18" cy="18" r="6.6"/><path d="M18 6.4V0.2M18 29.6v6.2M6.4 18H0.2M29.6 18h6.2M26.2 9.8l4.4-4.4M9.8 9.8L5.4 5.4M26.2 26.2l4.4 4.4M9.8 26.2l-4.4 4.4"/></svg></div><div class="vnum" id="vnum"></div><div class="vcol"><div class="varrow"><svg viewBox="0 0 24 24" fill="none" stroke="#e5e9eb" stroke-width="3.8" stroke-linecap="round"><path d="M12 3.5v17M3.5 12h17"/></svg></div><div class="vtrack"><div class="vfill" id="vfill"></div></div><div class="varrow"><svg viewBox="0 0 24 24" fill="none" stroke="#e5e9eb" stroke-width="3.8" stroke-linecap="round"><path d="M3.5 12h17"/></svg></div></div></div>
<div id="osd"><div class="oico"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="8" fill="#fff" stroke="none"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.6 10.6l4.2 4.2M33.2 33.2l4.2 4.2M10.6 37.4l4.2-4.2M33.2 14.8l4.2-4.2"/></svg></div><div class="otrack"><div class="ofill" id="ofill"></div></div><div class="onum" id="onum"></div></div>
<script>
/*
 * The input bar: an overlay over the picture with the HDMI inputs Glasshouse
 * Home shows, in its order and without the ones it hides. Each press of the
 * remote's Input key moves to the next, round to the first (the key filter
 * hands a press while the bar is up to it as Right), and switches to it a
 * second later; OK switches at once, Back closes, and it closes itself when
 * left alone. Strict ES5: the TV's own browser runs it.
 *
 * It is the app's own page rather than one served by Glasshouse: on a C1
 * (webOS 6.5) WebAppMgr suspended a page the app went on to, and the window
 * came up only 4 s after the press. Its data and the icons (devicons.js) come
 * from the server; with the server not answering, the window just closes.
 */
(function () {
  // Filled in with the dashboard's port when the app is installed.
  var PORT = 8080;                // tvweb:port
  var BASE = 'http://localhost:' + PORT;
  var KEY = { left: 37, up: 38, right: 39, down: 40, ok: 13, back: 461, backspace: 8 };
  var IDLE_MS = 6000;
  // On the input already on screen there is nothing to switch to, so the bar
  // goes sooner.
  var IDLE_ON_NOW_MS = 3000;
  // A press landing on another input switches to it this long after, as
  // LG's input bar does, unless another press moves on first.
  var SWITCH_MS = 1000;
  var list = [], focus = 0, onPort = null, onDevs = null, underHome = false, isTransparent = false, switchOnOk = false, idle = null, switchTimer = null, closing = false;

  function $(id) { return document.getElementById(id); }
  function bodyClass(on) {
    var cls = [];
    if (on) cls.push('on');
    if (isTransparent) cls.push('transparent');
    if (list.length >= 6) cls.push('tworow');
    return cls.join(' ');
  }
  // The input last watched; under a Home screen it is not on screen, so
  // choosing it still switches to it.
  function isLast(e) {
    if (!e) return false;
    if (e.tuner) return onPort === 'tuner';
    if (!e.port) return false;
    return e.port === onPort && (!onDevs || onDevs.indexOf(e.id) !== -1);
  }
  function isOn(e) {
    return !underHome && isLast(e);
  }
  function isSoleOn(e) {
    return isOn(e) && (!onDevs || onDevs.length <= 1);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function getJson(url, cb) {
    var x = new XMLHttpRequest();
    x.open('GET', url, true);
    x.timeout = 4000;
    x.onload = function () { var j = null; try { j = JSON.parse(x.responseText); } catch (e) {} cb(j); };
    x.onerror = x.ontimeout = function () { cb(null); };
    x.send();
  }
  /*
   * Switches to the input as Glasshouse Home's tile does (lib/home.js open):
   * its app, with the device's CEC id where it is behind a receiver. Launched
   * from here rather than through the server, whose POSTs refuse this page's
   * origin (file://, sent as "null").
   */
  function callService(uri, payload, cb) {
    try {
      var bridge = new window.PalmServiceBridge();
      bridge.onservicecallback = function (raw) {
        var res = null;
        try { res = JSON.parse(raw); } catch (e) {}
        cb(res);
      };
      bridge.call(uri, JSON.stringify(payload));
    } catch (e) {
      cb(null);
    }
  }
  function launchInput(d, cb) {
    if (d.kind === 'airplay') {
      return callService('luna://airplay.service/showAirplayPage', {}, function (r) {
        if (r && r.returnValue) return cb();
        callService('luna://com.webos.applicationManager/launch', { id: 'airplay', params: {} }, cb);
      });
    }
    if (d.appId) {
      return callService('luna://com.webos.applicationManager/launch',
        { id: d.appId, params: d.params || (d.deviceId ? { requestDevice: d.deviceId } : {}) }, cb);
    }
    var id = d.tuner ? 'com.webos.app.livetv' : 'com.webos.app.' + d.input;
    var params = !d.tuner && typeof d.uniqueId === 'number' && d.uniqueId > 0 && d.uniqueId < 15 ?
      { id: 'uniqueId', value: String(d.uniqueId) } : {};
    callService('luna://com.webos.applicationManager/launch', { id: id, params: params }, cb);
  }

  /*
   * The level bar. Opened by a launch carrying { glasshouse: 'osd', kind:
   * 'brightness', level } (the key filter, once for each press), it draws that
   * level at once and then follows the server's while the key is held, up to
   * OSD_IDLE_MS after the last change. A press while it is up only moves the
   * time it closes. The page cannot ask the settings service itself: an app
   * installed from developer mode holds only luna's public group, and a
   * requiredPermissions in its appinfo.json does not add settings.read.
   */
  var OSD_IDLE_MS = 1600;
  var OSD_POLL_MS = 120;
  var OSD_FILL_MAX = 547;
  var osdTimer = null, osdPoll = null, osdLevel = -1, osdOpen = false, osdCloseTimer = null, osdStyle = 'osdlg', osdPainted = '';
  // The class the body carries while the bar is up: the LG-style bar, unless the launch or the server names another.
  function osdClass(style) {
    osdStyle = style === 'horizontal' ? 'osdh' : style === 'vertical' ? 'osdvp' : 'osdlg';
  }
  function osdBodyClass() {
    document.body.className = 'osdon ' + osdStyle;
  }
  // Writes the level to the style on screen only; a change of style paints the other again.
  function osdPaint() {
    if (osdStyle === 'osdh' || osdStyle === 'osdvp') {
      // The fill runs along the track: its width in the horizontal pill, its height in the upright one.
      var fill = $('ofill').style;
      fill.width = osdStyle === 'osdh' ? osdLevel + '%' : '';
      fill.height = osdStyle === 'osdvp' ? osdLevel + '%' : '';
      $('onum').textContent = String(osdLevel);
    } else {
      // A level above 0 is at least as tall as the fill is wide, so its ends stay round.
      $('vfill').style.height = (osdLevel > 0 ? Math.max(18, Math.round(osdLevel * OSD_FILL_MAX / 100)) : 0) + 'px';
      $('vnum').textContent = String(osdLevel);
    }
    osdPainted = osdStyle;
  }
  // True where the level is not the one drawn.
  function osdDraw(level) {
    var changed = level !== osdLevel;
    if (!changed && osdPainted === osdStyle) return false;
    osdLevel = level;
    osdPaint();
    return changed;
  }
  function osdStill() {
    clearTimeout(osdTimer);
    osdTimer = setTimeout(osdClose, OSD_IDLE_MS);
  }
  function osdClose() {
    clearTimeout(osdTimer);
    clearInterval(osdPoll);
    osdPoll = null;
    osdOpen = false;
    document.body.className = '';
    // Not closed for real if a press shows the bar again while it fades (osdShow).
    clearTimeout(osdCloseTimer);
    osdCloseTimer = setTimeout(function () { window.close(); }, 170);
  }
  function osdFollow() {
    if (osdPoll) return;
    osdPoll = setInterval(function () {
      getJson(BASE + '/api/remotekeys/brightness', function (j) {
        if (osdOpen && j && j.ok) {
          // A style changed on the Remote tab while the bar is up takes effect at once.
          if (j.style) { var before = osdStyle; osdClass(j.style); if (before !== osdStyle) osdBodyClass(); }
          if (osdDraw(j.level)) osdStill();
        }
      });
    }, OSD_POLL_MS);
  }
  function osdShow(p) {
    var level = Math.max(0, Math.min(100, Math.round(Number(p.level))));
    if (isNaN(level)) return osdClose();
    clearTimeout(switchTimer);
    clearTimeout(idle);
    clearTimeout(osdCloseTimer);
    closing = false;
    osdOpen = true;
    osdClass(p.style);
    osdDraw(level);
    osdBodyClass();
    osdStill();
    osdFollow();
  }
  // What a launch or relaunch carried: the event's detail, else the app's launch parameters.
  function launchParamsNow(e) {
    var p = e && e.detail;
    if (!p || typeof p !== 'object') {
      try { p = JSON.parse(window.PalmSystem.launchParams || '{}'); } catch (x) { p = {}; }
    }
    return p || {};
  }

  function close() {
    if (closing) return;
    closing = true;
    clearTimeout(switchTimer);
    document.body.className = bodyClass(false);
    setTimeout(function () { window.close(); }, 160);
  }
  function stillThere() {
    clearTimeout(idle);
    var onNow = isSoleOn(list[focus]);
    idle = setTimeout(close, onNow ? IDLE_ON_NOW_MS : IDLE_MS);
  }

  // The inputs as Glasshouse Home's Inputs row has them: its order, less the
  // hidden ones and, where it leaves them out, those with nothing connected.
  function inputsFrom(cat) {
    var out = [], byId = {}, layout = cat.layout || {};
    var hidden = (layout.hidden && layout.hidden.dev) || [];
    (cat.devices || []).forEach(function (d) { byId[d.id] = d; });
    var order = (cat.order && cat.order.dev) || (cat.devices || []).map(function (d) { return d.id; });
    order.forEach(function (id) {
      var d = byId[id];
      if (!d || hidden.indexOf(id) !== -1) return;
      if (d.unused && layout.hideUnused === true) return;
      out.push(d);
    });
    return out;
  }

  // A tile as drawn: kept with the input, so the last bar can be drawn again
  // at once on the next open, before the server has answered.
  function entry(d) {
    return { id: d.id, name: d.name, tuner: !!d.tuner, port: d.port, input: d.input, uniqueId: d.uniqueId,
             kind: d.kind || null, appId: d.appId || null, deviceId: d.deviceId || null,
             icon: window.glasshouseDevIcon(d) };
  }
  function render() {
    var twoRow = list.length >= 6;
    var cols = twoRow ? Math.ceil(list.length / 2) : list.length;
    var style = cols > 5 ? ' style="width:' + (Math.floor(1824 / cols) - 24) + 'px"' : '';
    var html = '';
    list.forEach(function (e, i) {
      if (twoRow && i === cols) html += '<br>';
      var cls = 'tile' + (i === focus ? ' focus' : '') + (isOn(e) ? ' now' : '');
      var sub = e.kind === 'dms' ? 'Media Server'
        : e.kind === 'usb' ? 'USB'
        : e.kind === 'av' ? 'AV' : e.kind === 'component' ? 'Component'
        : (e.tuner || e.kind) ? ''
        : 'HDMI ' + e.port;
      html += '<div class="' + cls + '" data-i="' + i + '"' + style + '><div class="head">' + e.icon +
        '<div class="txt"><div class="nm">' + esc(e.name) + '</div>' +
        (sub ? '<div class="path">' + esc(sub) + '</div>' : '') + '</div></div></div>';
    });
    $('tiles').innerHTML = html;
  }
  // byKey: moved by the remote's keys rather than the pointer, so the
  // switch follows on its own.
  function setFocus(i, byKey) {
    if (!list.length) return;
    clearTimeout(switchTimer);
    focus = (i + list.length) % list.length;
    moved = true;
    var tiles = $('tiles').querySelectorAll('.tile');
    for (var k = 0; k < tiles.length; k++) {
      tiles[k].className = 'tile' + (k === focus ? ' focus' : '') + (isOn(list[k]) ? ' now' : '');
    }
    stillThere();
    // Switch on OK (Inputs tab): stepping only picks an input (#1532).
    if (byKey && !switchOnOk && !isSoleOn(list[focus])) switchTimer = setTimeout(choose, SWITCH_MS);
  }
  function choose() {
    clearTimeout(switchTimer);
    var d = list[focus];
    if (!d || isSoleOn(d)) return close();
    clearTimeout(idle);
    launchInput(d, close);
    // The switch happens on the TV whether or not the answer gets back here.
    setTimeout(close, 1200);
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    if (k === KEY.right) setFocus(focus + 1, true);
    else if (k === KEY.left) setFocus(focus - 1, true);
    else if (k === KEY.down && list.length >= 6) {
      var colsD = Math.ceil(list.length / 2);
      setFocus(focus < colsD ? Math.min(focus + colsD, list.length - 1) : focus - colsD, true);
    } else if (k === KEY.up && list.length >= 6) {
      var colsU = Math.ceil(list.length / 2);
      setFocus(focus >= colsU ? focus - colsU : Math.min(focus + colsU, list.length - 1), true);
    } else if (k === KEY.ok) choose();
    else if (k === KEY.back || k === KEY.backspace) close();
    else return;
    e.preventDefault();
  }, true);
  // The Magic Remote's pointer: hovering a tile focuses it, clicking switches.
  $('tiles').addEventListener('mouseover', function (e) {
    var el = e.target;
    while (el && el !== this && !el.getAttribute('data-i')) el = el.parentNode;
    if (el && el !== this) setFocus(+el.getAttribute('data-i'));
  });
  $('tiles').addEventListener('click', function () { choose(); });
  var CACHE = 'glasshouse.inputbar';
  var moved = false, waiting = 0, now = null, cat = null;
  function focusOn() {
    focus = 0;
    for (var i = 0; i < list.length; i++) if (isLast(list[i])) { focus = i; break; }
  }
  function show() {
    render();
    document.body.className = bodyClass(true);
    stillThere();
  }

  // The icons, what is on now and the inputs, asked for together; the bar is
  // drawn again from them where anything has changed.
  function ready() {
    if (--waiting > 0 || closing) return;
    if (!cat || !window.glasshouseDevIcon) { if (!list.length) close(); return; }
    var fresh = inputsFrom(cat).map(entry);
    if (!fresh.length) return close();
    var port = now && now.kind === 'input' ? now.port : (now && now.kind === 'channel' ? 'tuner' : null);
    var devs = now && now.kind === 'input' && Array.isArray(now.devices) ? now.devices : null;
    var under = !!now && now.behindHome === true;
    var trans = !!(cat.layout && cat.layout.inputBarTransparent);
    switchOnOk = !!(cat.layout && cat.layout.inputBarSwitchOnOk);
    var same = JSON.stringify(fresh) === JSON.stringify(list) && port === onPort && JSON.stringify(devs) === JSON.stringify(onDevs) && under === underHome && trans === isTransparent;
    try { window.localStorage.setItem(CACHE, JSON.stringify({ list: fresh, onPort: port, onDevs: devs, underHome: under, transparent: trans, switchOnOk: switchOnOk })); } catch (e) {}
    if (same && /\bon\b/.test(document.body.className)) return;
    // Moved already: the focus stays on the same input where it is still there.
    var keepId = moved && list[focus] ? list[focus].id : null;
    list = fresh;
    onPort = port;
    onDevs = devs;
    underHome = under;
    isTransparent = trans;
    focusOn();
    if (keepId) for (var i = 0; i < list.length; i++) if (list[i].id === keepId) focus = i;
    show();
  }

  /*
   * Opening the bar: the last one drawn at once, so the window comes up with
   * its first frame, then what the server says. Run at load and again each
   * time the kept-alive app is opened after closing.
   */
  function start() {
    clearTimeout(switchTimer);
    closing = false;
    moved = false;
    try {
      var kept = JSON.parse(window.localStorage.getItem(CACHE) || 'null');
      if (kept && kept.list && kept.list.length) {
        list = kept.list;
        onPort = kept.onPort;
        onDevs = Array.isArray(kept.onDevs) ? kept.onDevs : null;
        underHome = kept.underHome === true;
        isTransparent = kept.transparent === true;
        switchOnOk = kept.switchOnOk === true;
        focusOn();
        show();
      }
    } catch (e) {}
    stillThere();
    now = null;
    cat = null;
    waiting = window.glasshouseDevIcon ? 2 : 3;
    if (!window.glasshouseDevIcon) {
      var icons = document.createElement('script');
      icons.onload = icons.onerror = ready;
      icons.src = BASE + '/assets/devicons.js';
      document.head.appendChild(icons);
    }
    getJson(BASE + '/api/home/now', function (j) { now = j; ready(); });
    getJson(BASE + '/api/home/catalogue', function (j) { cat = j; ready(); });
  }

  /*
   * Preloaded: the Glasshouse server starts the app hidden ({"preload":
   * "full"}) at boot, at switch-on and after each close, so a press finds the
   * page loaded and only the window to show. A preloaded page draws nothing
   * and sets no timer until that press, which reaches it as a relaunch.
   */
  function preloaded() {
    var p = {};
    try { p = JSON.parse(window.PalmSystem.launchParams || '{}') || {}; } catch (e) {}
    return !!p.preload;
  }
  var idleUntilOpened = preloaded();
  // A relaunch while the bar is up is a further press that reached it that
  // way rather than as a key: it moves on. One carrying a level is a Brightness
  // key's, which draws the level bar instead.
  document.addEventListener('webOSRelaunch', function (e) {
    var p = launchParamsNow(e);
    if (p.glasshouse === 'osd') { idleUntilOpened = false; return osdShow(p); }
    // The Input key pressed while the level bar is up: the level bar goes, the input bar opens.
    clearTimeout(osdCloseTimer);
    if (osdOpen) {
      osdOpen = false;
      clearTimeout(osdTimer);
      clearInterval(osdPoll);
      osdPoll = null;
      idleUntilOpened = false;
      return start();
    }
    if (idleUntilOpened || closing) { idleUntilOpened = false; start(); }
    else setFocus(focus + 1, true);
  });
  var firstParams = launchParamsNow(null);
  if (firstParams.glasshouse === 'osd') {
    idleUntilOpened = false;
    osdShow(firstParams);
  } else if (idleUntilOpened) {
    // Only the icons, so the first open draws at once.
    var icons = document.createElement('script');
    icons.src = BASE + '/assets/devicons.js';
    document.head.appendChild(icons);
  } else {
    start();
  }
})();
</script>
</body>
</html>
