<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Video Screen Saver</title>
<style>
@font-face{font-family:Outfit;src:url(file:///var/lib/tvweb/assets/fonts/Outfit-Light.ttf)}
@font-face{font-family:Manrope;src:url(file:///var/lib/tvweb/assets/fonts/Manrope-Regular.ttf)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ece7df;font-family:Manrope,Arial,sans-serif}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#shade{position:absolute;inset:0;background:#000;opacity:__TVWEB_LAYER_OPACITY__;pointer-events:none}
#clock,#weather,#caption,#issue{position:absolute;z-index:2;text-shadow:0 2px 8px #000,0 0 18px #000}
#clock{left:5.83%;top:6.67%}#time{font:112px Outfit,Arial,sans-serif;letter-spacing:-2px}#date{margin-top:8px;color:#a39d93;font-size:22px}
#weather{right:5.83%;top:6.67%;display:flex;align-items:center;gap:8px;text-align:right}#wxIcon{width:64px;height:64px;stroke:#ece7df;stroke-width:1.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
#temp{font:96px Outfit,Arial,sans-serif;letter-spacing:-2px}#conditions{width:360px;color:#a39d93;font-size:22px;white-space:normal}
#caption{right:5.83%;bottom:8%;width:34%;text-align:right;font-size:32px;line-height:1.3;white-space:normal}
#issue{left:5.83%;bottom:6.67%;max-width:72%;color:#a39d93;font-size:22px}
</style>
</head>
<body>
<video id="video" muted playsinline></video><div id="shade"></div>
<section id="clock"><div id="time">--:--</div><div id="date"></div></section>
<section id="weather" hidden><svg id="wxIcon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><div><div id="temp"></div><div id="conditions"></div></div></section>
<div id="caption"></div><div id="issue"></div>
<script>
var list=__TVWEB_VIDEOS__,weatherUrl="__TVWEB_HOME_WEATHER__",video=document.getElementById('video'),idx=0,failures=0;
var items=list&&list.items?list.items:[];
function clock(){var d=new Date(),p=function(n){return n<10?'0'+n:n};document.getElementById('time').textContent=p(d.getHours())+':'+p(d.getMinutes());document.getElementById('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});}
function caption(){var item=items[idx],text=item&&item.title||'',s=video.currentTime||0,points=item&&item.pointsOfInterest||[];for(var i=0;i<points.length;i++){if(Number(points[i].at)>s)break;text=points[i].text||text;}document.getElementById('caption').textContent=text;}
function play(){if(!items.length){document.getElementById('issue').textContent='No videos are configured.';return;}var item=items[idx];video.oncanplay=function(){var p=video.play();if(p&&p.catch)p.catch(function(e){document.getElementById('issue').textContent='Video playback failed: '+e;});};video.onended=function(){idx=(idx+1)%items.length;play();};video.onerror=function(){document.getElementById('issue').textContent='The browser could not load this video (media error '+(video.error?video.error.code:'unknown')+').';if(++failures<items.length){idx=(idx+1)%items.length;play();}};video.src=item.url;video.load();caption();}
function refreshWeather(){var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState!==4)return;try{var d=JSON.parse(x.responseText);if(d&&d.ok){document.getElementById('weather').hidden=false;document.getElementById('temp').textContent=Math.round(d.temp)+'°';document.getElementById('conditions').textContent=(d.city?d.city+'  ·  ':'')+(d.condition||'');}}catch(e){}};x.open('GET',weatherUrl,true);x.send();}
video.addEventListener('timeupdate',caption);clock();refreshWeather();setInterval(clock,1000);setInterval(refreshWeather,600000);play();
</script>
</body>
</html>
