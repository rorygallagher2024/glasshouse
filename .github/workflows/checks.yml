# Offline checks that need nothing but the repository (and Node for tests/types).
name: checks

# Branch pushes run through their PR, so a push to one runs once rather than
# once per event. A branch without a PR can be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the release tags, for the entity stability check

      # The TV runs node 0.12, where an ES6 construct is a parse error rather
      # than a degraded feature - the server simply never starts.
      - name: ES5 only in the on-TV server
        run: ./scripts/check-es5.py

      - name: tvweb.js and lib modules parse
        run: node --check server/tvweb.js && for f in server/lib/*.js; do node --check "$f"; done

      - name: dashboard reaches for no missing element
        run: ./scripts/check-ui-ids.py

      # TypeScript reads a missing export of a JS module as any here, so a
      # caller left behind by a rename is only found at run time.
      - name: server calls only what its modules export
        run: ./scripts/check-module-calls.py

      - name: strings keyed and translations current
        run: ./scripts/check-strings.py

      - name: screen saver QML matches its declared QtQuick version
        run: ./scripts/check-screensavers.py

      - name: documented entity list and deploy list match the code
        run: ./scripts/check-drift.py

      # An entity that goes or is renamed breaks the automations that used it.
      - name: no Home Assistant entity from the last release gone without a reason
        run: ./scripts/check-entity-stability.py

      # Preinstalled on ubuntu-latest.
      - name: shell scripts
        run: shellcheck server/deploy.sh server/tvwebctl server/50-tvweb.sh tvstats.sh

      - name: TypeScript type check
        run: npm ci && npx tsc

      - name: unit tests
        run: node test/run-all.js

      - name: Homebrew Channel package builds
        run: npm install -g @webos-tools/cli@3.2.6 && python3 scripts/build-ipk.py

      - name: entity templates resolve against fixture
        run: ./scripts/check-entities.py --stats test/fixtures/stats-b8-webos4.json

  # The unit tests again on the node each kind of supported TV runs, since a
  # laptop's node accepts calls an older one lacks: 0.12 on webOS 4 (B8),
  # 8.12 on webOS 6 (50UP81006LR) and 16 on webOS 9 (C2).
  tv-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['0.12', '8.12', '16', '24']
    name: unit tests on node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && node test/run-all.js
