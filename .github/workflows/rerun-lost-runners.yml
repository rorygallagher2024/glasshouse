# Re-runs, once, the jobs of a Checks run that GitHub lost the runner of.
#
# Now and then one unit-test job goes silent from the start of its test step
# and ends with "The hosted runner lost communication with the server", or is
# stopped at tv-node's 5-minute limit. Its log is never uploaded and its test
# step never completes. Run locally 2,040 times, 8 suites at a time, the tests
# never failed, timed out or grew past 400 MB, so these are GitHub's losses,
# not the tests'.
#
# A real failure is never re-run: its step completes ("Process completed with
# exit code 1") and it has a log, and so does a test that hangs until the
# limit. Only a run whose every failed or cancelled job looks lost is re-run.
#
# workflow_run runs in this repository with its own token, so a pull request
# from a fork is re-run too. Nothing from the pull request is checked out.
name: Re-run lost runners

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions:
  actions: write
  checks: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.run_attempt == 1 &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed jobs if every one lost its runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          lost=0
          for job in $(gh api "repos/$GH_REPO/actions/runs/$RUN/attempts/1/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | .id'); do
            # The job's check run carries the reason it ended.
            reasons=$(gh api "repos/$GH_REPO/check-runs/$job/annotations" \
              --jq '.[] | select(.annotation_level == "failure") | .message')
            echo "job $job: $reasons"
            if ! printf '%s\n' "$reasons" | grep -qE 'hosted runner lost communication|exceeded the maximum execution time'; then
              echo "job $job ended on its own: not re-running"; exit 0
            fi
            # A lost runner uploads no log (404 BlobNotFound); a test that
            # hung until the limit has one.
            if gh api --silent "repos/$GH_REPO/actions/jobs/$job/logs" 2>/dev/null; then
              echo "job $job has a log: not re-running"; exit 0
            fi
            lost=$((lost + 1))
          done
          if [ "$lost" -gt 0 ]; then
            echo "re-running $lost lost job(s)"
            gh run rerun "$RUN" --failed
          fi
