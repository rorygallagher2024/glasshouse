# Home Assistant creates no entity for a discovery config it cannot validate,
# and says so only in its own log: Volume, Mute and the volume buttons went
# missing that way in 0.78.0 (#437). This builds every config the server can
# publish and runs it through Home Assistant's own validation.
name: Home Assistant

# Only when what the configs are built from changes. Home Assistant is not
# pinned, so it also runs weekly: a release that starts rejecting a config
# shows without waiting for a change here.
on:
  push:
    branches: [main]
    paths:
      - 'server/lib/**'
      - 'server/tvweb.js'
      - 'scripts/discovery-configs.js'
      - 'scripts/check-ha-discovery.py'
      - 'test/fixtures/lgsettings-c2-webos22.json'
      - 'test/fixtures/stats-*.json'
      - '.github/workflows/home-assistant.yml'
  pull_request:
    paths:
      - 'server/lib/**'
      - 'server/tvweb.js'
      - 'scripts/discovery-configs.js'
      - 'scripts/check-ha-discovery.py'
      - 'test/fixtures/lgsettings-c2-webos22.json'
      - 'test/fixtures/stats-*.json'
      - '.github/workflows/home-assistant.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    name: Discovery validation
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Home Assistant installed, not only downloaded: with pip's download
      # cache the install still took 41 s of the job. The key changes each
      # week, so the weekly run takes the newest release, and with the
      # Python version, which the environment is tied to.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: venv
        uses: actions/cache@v6
        with:
          path: ~/ha-venv
          key: ha-venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ steps.week.outputs.week }}
      - if: steps.venv.outputs.cache-hit != 'true'
        run: python -m venv ~/ha-venv && ~/ha-venv/bin/pip install homeassistant
      - run: ~/ha-venv/bin/python ./scripts/check-ha-discovery.py
