# The catalogue of launchers, read in full each week: a launcher hosted by
# its author that has gone, or changed since it was listed, fails this run,
# so its entry can be updated or taken out. Pull requests pass over an
# outage of an entry they do not change (scripts/check-launchers.py).
name: Launchers

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

jobs:
  catalogue:
    runs-on: ubuntu-latest
    name: Catalogue of launchers
    steps:
      - uses: actions/checkout@v7
      - name: every launcher listed can be read and matches its entry
        run: ./scripts/check-launchers.py --strict
