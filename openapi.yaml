          type: array
          items:
            type: object
            additionalProperties: true
        huesyncStreaming:
          type: object
          additionalProperties: true
        keyboardUp:
          type: boolean
      description: Telemetry snapshot. Typed from a live response; fields shown without a type were null
        on the sampled TV. Many fields are model- or webOS-dependent.
    SettingsWrite:
      type: object
      required:
      - mqtt
      - device
      properties:
        mqtt:
          type: object
          properties:
            enabled:
              type: boolean
              description: Requires `host` when true.
            host:
              type: string
            port:
              type:
              - integer
              - 'null'
              minimum: 1
              maximum: 65535
            tls:
              type: boolean
            tlsRejectUnauthorized:
              type: boolean
              default: true
            username:
              type: string
            password:
              type: string
              description: Omit to keep; "" to clear.
            topicPrefix:
              type: string
              default: lgtv
              description: No `+`, `#`, spaces, or leading/trailing `/`.
            discoveryPrefix:
              type: string
              default: homeassistant
            telemetryIntervalMs:
              type: integer
              minimum: 1000
              maximum: 600000
            entities:
              type: object
              description: Booleans per category (controls, oled, video, system, diagnostics; default
                true) and a `disabled` list of entity ids.
              properties:
                controls:
                  type: boolean
                oled:
                  type: boolean
                video:
                  type: boolean
                system:
                  type: boolean
                diagnostics:
                  type: boolean
                disabled:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-z0-9_.]{1,64}$
        device:
          type: object
          required:
          - id
          properties:
            id:
              type: string
              pattern: ^[a-z0-9_]{1,64}$
              description: Keys every HA entity id; changing it orphans the old entities.
            name:
              type: string
        iconServer:
          type: boolean
    SettingsPayload:
      type: object
      properties:
        ok:
          type: boolean
        writable:
          type: boolean
        configFile:
          type: string
        iconServer:
          type: boolean
        mqtt:
          allOf:
          - $ref: '#/components/schemas/SettingsWrite/properties/mqtt'
          - type: object
            properties:
