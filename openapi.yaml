          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The `token` from config.json. Preferred; keeps it out of URLs and logs.
    queryToken:
      type: apiKey
      in: query
      name: k
      description: The `token` as `?k=`.
  parameters:
    AppId:
      name: id
      in: query
      required: true
      schema:
        type: string
      description: App id (or a recents id for the snapshot route).
    Playlist:
      name: pl
      in: query
      schema:
        type: string
      description: Playlist id.
  requestBodies:
    AppIdBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - id
            properties:
              id:
                type: string
    EditPage:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - launchPointId
            properties:
              launchPointId:
                type: string
              title:
                type: string
              address:
                type: string
    FreeJson:
      required: true
      description: Shape defined in a lib module that was not read; send a JSON object.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    OkObject:
      description: Success. A JSON object, usually with `ok`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            properties:
              ok:
                type: boolean
    InstallOk:
      description: '`install` is the job snapshot (job id, state, preview...).'
      content:
        application/json:
          schema:
            type: object
            properties:
              ok:
                type: boolean
              install:
                type: object
                additionalProperties: true
    Error:
      description: Failure with a message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: 'Malformed JSON, invalid value, or a refused action (`ok: false`, `error`).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Token set and not presented: `bad or missing token`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'One of: controls disabled in config; cross-origin request refused; Host

        not allowed for installs; sideloading off; TV-only route; token needed.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown route or resource (`not found`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadContentType:
      description: '`Content-Type must be ...` (415).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - ok
      - error
      properties:
        ok:
          const: false
        error:
          type: string
    Stats:
      type: object
      additionalProperties: true
      properties:
        ok:
          type: boolean
        time:
          type: number
        tvwebVersion:
          type: string
        device:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            name:
              type: string
            model:
              type: string
        system:
          type: object
          additionalProperties: true
          properties:
            webos:
              type: string
            firmware:
              type: string
        hardware:
          type: object
          additionalProperties: true
          properties:
            webos:
              type: string
            soc_arch:
              type: string
            ram:
              description: Null on the sampled TV; the type on other models was not observed.
            refresh_rate:
              description: Null on the sampled TV; the type on other models was not observed.
            eye_sensor:
              type: string
        panel_silicon:
          description: Null on the sampled TV; the type on other models was not observed.
        remote:
          type: object
          additionalProperties: true
          properties:
            battery:
              description: Null on the sampled TV; the type on other models was not observed.
            model:
              type: string
            mac:
              type: string
            firmware:
              type: string
            paired:
              type: boolean
            connected:
              type: boolean
            bluetooth:
              type: boolean
            signal:
              description: Null on the sampled TV; the type on other models was not observed.
        temp:
          type: number
        tempMillidegrees:
          type: number
        temps:
          type: array
          items:
            type: number
        load:
          type: number
        loadPeak:
          type: number
        mhz:
          description: Null on the sampled TV; the type on other models was not observed.
        cpuHz:
          description: Null on the sampled TV; the type on other models was not observed.
        cpuTimes:
          type: object
          description: Per-core jiffies keyed by core index.
          additionalProperties:
            type: object
            additionalProperties: true
            properties:
              user:
                type: number
              nice:
                type: number
              system:
                type: number
              idle:
                type: number
              iowait:
                type: number
              irq:
                type: number
              softirq:
                type: number
              steal:
                type: number
        cores:
          type: array
          items:
            type: number
        coresTotal:
