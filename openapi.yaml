openapi: 3.1.0
info:
  title: Glasshouse HTTP API
  version: 0.139.0
  summary: HTTP API served by Glasshouse (tvweb) on an LG webOS TV.
  description: "Reverse-engineered from `server/lib/routes.js`, `server/lib/controls.js` and\n`docs/SECURITY.md`\
    \ in rorygallagher2024/glasshouse (package.json 0.139.0).\nThere is no spec in the repo; this is derived\
    \ from the code.\n\n**Confidence.** Paths, methods, auth, gating, query params and request bodies\
    \ come from the\ndispatcher and are reliable. 27 GET response bodies are typed from live responses\
    \ of one\nTV on 2026-11-06 (shapes only; fields marked 'null on the sampled TV' have an unobserved\
    \ type\nand others may differ by model or webOS version). `/api/caps`, `/api/game/fps`, `/api/oledcare`\
    \ and `/api/settings`\nwere also checked live. POST bodies and responses of the remaining GETs come\
    \ from the code and\nare looser; the routes `/api/apps/install/status`, `/api/backup*`, `/api/logs`,\
    \ `/api/setup`,\n`/api/home/{picture,signal,wallpaper,icon,recents/image}` and `/api/iptv/{groups,browse,search,\n\
    logo,schedule,stream}` were not called.\n\n**Conventions that apply almost everywhere**\n- Replies\
    \ are JSON with `ok: true|false`; failures carry `error` (string).\n- `POST` bodies must be `Content-Type:\
    \ application/json` (415 otherwise),\n  max 8 KiB unless stated. A cross-origin `Origin` header is\
    \ refused (403).\n- `/api/control` returns **HTTP 200 even on failure**; check `ok`.\n- No CORS headers\
    \ are sent.\n- Auth: only when `token` is set in `config.json`. Requests from the TV\n  itself (127.0.0.1\
    \ / ::1) always pass.\n- `allowControl=false` (config) makes nearly every mutating route return\n\
    \  403 \"controls disabled in config\" (checked in `routes.js` or inside the\n  lib module). Reads\
    \ are unaffected. Exception found:\n  `POST /api/services/toggle` has no such check in the route or\
    \ in\n  `lib/services.js`.\n\n**Not covered here**: the MQTT bridge (topics under `<prefix>/status`,\n\
    `/telemetry`, `/update`, `/command/<name>`, `/state/<path>`,\n`/events/button`; Home Assistant discovery\
    \ under `homeassistant/`), the\nserved UI pages (`/`, `/assets/*`, `/home/launcher/*`), and the phone\n\
    setup handoff (`/?c=<code>`, `POST /mqtt` with the one-time code).\n"
servers:
- url: http://{tvHost}:{port}
  variables:
    tvHost:
      default: 192.168.1.20
      description: The TV's address.
    port:
      default: '8080'
      description: '`port` in config.json.'
security:
- {}
- bearerAuth: []
- queryToken: []
tags:
- name: system
- name: control
- name: audio
- name: picture
- name: privacy
- name: apps
- name: install
- name: home
- name: iptv
- name: settings
- name: oled
paths:
  /api/caps:
    get:
      tags:
      - system
      summary: Capabilities and version
      description: '`key` (the token) is included only when the request comes from the TV

        itself and a token is set; the TV puts it into QR codes.

        '
      parameters:
      - name: from
        in: query
        schema:
          type: string
          enum:
          - home
        description: 'From the TV: marks Glasshouse Home''s page alive.'
      responses:
        '200':
          description: Capabilities.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                  allowControl:
                    type: boolean
                  allowPower:
                    type: boolean
                  origin:
                    type:
                    - string
                    - 'null'
                  version:
                    type: string
                  fromHomebrewChannel:
                    type: boolean
                  setupNeeded:
                    type: boolean
                  clockHour12:
                    type: boolean
                  key:
                    type: string
                    description: Token; TV-local requests only.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stats:
    get:
      tags:
      - system
      summary: Live telemetry snapshot (1.5 s cache)
      parameters:
      - name: with
        in: query
        schema:
          type: string
          enum:
          - settings
        description: Adds `lgSettings` rows (sound, hdmi, devices).
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/prometheus/metrics:
    get:
      tags:
      - system
      summary: Prometheus scrape endpoint
      description: Exists only while `prometheus.enabled` is on; otherwise 404. Send the token as a Bearer
        header.
      responses:
        '200':
          description: Prometheus text exposition format (`glasshouse_*` families).
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/cpu:
    get:
      tags:
      - system
      summary: Per-core CPU and top processes
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cpu'
  /api/processes:
    get:
      tags:
      - system
      summary: Process list
      parameters:
      - name: all
        in: query
        schema:
          type: string
          enum:
          - '1'
          - 'true'
        description: Include all processes.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Processes'
  /api/hdmi:
    get:
      tags:
      - system
      summary: HDMI inputs and link state
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hdmi'
  /api/history:
    get:
      tags:
      - system
      summary: Watch time by UTC hour
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 400
          default: 35
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/History'
  /api/logs:
    get:
      tags:
      - system
      summary: TV system, Glasshouse and kernel logs
      parameters:
      - name: sources
        in: query
        schema:
          type: string
        description: Comma list, e.g. `system,glasshouse,kernel`.
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
      - name: filter
        in: query
        schema:
          type: string
      - name: since
        in: query
        schema:
          type: string
      - name: redact
        in: query
        schema:
          type: string
          enum:
          - '1'
          - 'true'
        description: Redact addresses and credentials.
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/update:
    get:
      tags:
      - system
      summary: Known update state (never checks GitHub itself)
      description: Trigger a check with `POST /api/control` action `updateCheck`.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSummary'
  /api/control:
    post:
      tags:
      - control
      summary: Run a control action
      description: 'One endpoint, many actions. Body is `{ "action": <name>, "value": <any> }`,

        max 4 KiB. Always HTTP 200 for a handled request; read `ok`/`error`.

        Power actions (`powerOn`, `powerOff`, `reboot`) also need `allowPower`.

        Boolean-ish `value`s accept `true`, `"on"`, `"ON"`, `"true"`.

        See `ControlRequest` for the full action list with value shapes.

        '
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRequest'
            examples:
              volume:
                value:
                  action: volume
                  value: 12
              mute:
                value:
                  action: mute
                  value: true
              remoteKey:
                value:
                  action: rcu
                  value: ok
              launch:
                value:
                  action: launch_app
                  value: netflix
              toast:
                value:
                  action: toast
                  value: Dinner is ready
      responses:
        '200':
          description: 'Result. Failures are still 200 with `ok: false`.'
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/BadContentType'
  /api/audio:
    get:
      tags:
      - audio
      summary: Audio status
      parameters:
      - name: with
        in: query
        schema:
          type: string
          enum:
          - settings
        description: Adds `lgSettings` rows and `inputs`.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Audio'
    post:
      tags:
      - audio
      summary: Set the DTS override
      x-gates:
      - allowControl
      - hostAllowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/audio/bluetooth:
    get:
      tags:
      - audio
      summary: Paired Bluetooth audio devices
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioBluetooth'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      tags:
      - audio
      summary: Connect or disconnect a Bluetooth device
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: Action name defined in lib/btaudio.js (not read).
                address:
                  type: string
                  description: Device address.
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picture:
    get:
      tags:
      - picture
      summary: Picture settings rows for the picture on screen
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Picture'
  /api/game:
    get:
      tags:
      - picture
      summary: Game Optimizer settings and picture mode
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
  /api/game/fps:
    get:
      tags:
      - picture
      summary: Game frame rate (poll about once a second)
      responses:
        '200':
          description: Zeroed unless the game input is the app on screen.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  fps:
                    type: object
                    properties:
                      frameRate:
                        type: number
                      vrrType:
                        type: string
                        examples:
                        - false
                        - gsync
                      port:
                        type:
                        - integer
                        - 'null'
  /api/lgsettings:
    get:
      tags:
      - picture
      summary: LG settings as rows
      parameters:
      - name: section
        in: query
        schema:
          type: string
        description: Comma list, e.g. `sound,devices`.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LgSettings'
  /api/screensaver:
    get:
      tags:
      - picture
      summary: Available screen savers
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Screensaver'
  /api/servicemenu:
    get:
      tags:
      - oled
      summary: Service menu lock state
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMenu'
  /api/oledcare:
    get:
      tags:
      - oled
      summary: OLED panel care state
      description: Nullable fields are null where the TV reports nothing.
      responses:
        '200':
          description: Panel care.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  isOled:
                    type: boolean
                  available:
                    type: boolean
                  serviceControls:
                    type: boolean
                  writable:
                    type: boolean
                  gsr:
                    type:
                    - boolean
                    - 'null'
                  tpc:
                    type:
                    - boolean
                    - 'null'
                  gsrStressCount:
                    type:
                    - integer
                    - 'null'
                  screenShift:
                    type:
                    - string
                    - boolean
                    - 'null'
                  logoDimming:
                    type:
                    - string
                    - 'null'
                  panelHours:
                    type:
                    - number
                    - 'null'
                  hoursUntilComp:
                    type:
                    - number
                    - 'null'
                  compInterval:
                    type: number
                    default: 4
                  hoursUntilRefresher:
                    type:
                    - number
                    - 'null'
                  refresherInterval:
                    type: number
                    default: 2000
                  compStatus:
                    type:
                    - string
                    - 'null'
                  refresherStatus:
                    type:
                    - string
                    - 'null'
                  compCycles:
                    type:
                    - integer
                    - 'null'
                  refresherCycles:
                    type:
                    - integer
                    - 'null'
                  failureAlerts: {}
  /api/screentime:
    get:
      tags:
      - settings
      summary: Screen-time limits
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenTime'
    post:
      tags:
      - settings
      summary: Change screen-time limits
      description: Body is validated by `lib/screentime.js` (not read); 400 with `error` on invalid input.
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Error'
  /api/ssh:
    get:
      tags:
      - settings
      summary: SSH authorized keys
      description: Key comments and options are omitted when no token is set.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ssh'
    post:
      tags:
      - settings
      summary: Add or remove a key, or delete the key file
      description: 'Needs a token to be configured, even from the TV (403 otherwise).

        `deleteFile` makes the Homebrew Channel set root''s password to the public

        default `alpine` at next reboot.

        '
      x-gates:
      - allowControl
      - tokenConfigured
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - action
                - key
                properties:
                  action:
                    const: add
                  key:
                    type: string
                    description: A public key line.
              - type: object
                required:
                - action
                - fingerprint
                properties:
                  action:
                    const: remove
                  fingerprint:
                    type: string
                    description: SHA256 fingerprint as `ssh-keygen -l` prints it.
              - type: object
                required:
                - action
                properties:
                  action:
                    const: deleteFile
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/tvapp:
    get:
      tags:
      - settings
      summary: On-TV dashboard app status
      description: Install/remove it with `POST /api/control` actions `tvAppInstall` / `tvAppRemove`.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TvApp'
  /api/setup:
    get:
      tags:
      - settings
      summary: First-run setup state
      description: TV-local only (403 otherwise), unless `?demo=1` (or `emulateSetup` in config), which
        returns simulated state for docs screenshots.
      x-gates:
      - fromTV
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - settings
      summary: Setup actions
      description: Body max 1 KiB. `allowControl` is required for everything except `done`.
      x-gates:
      - fromTV
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - action
                - open
                properties:
                  action:
                    const: network
                  open:
                    type: boolean
                    description: true opens the dashboard to the network; restarts the server.
              - type: object
                required:
                - action
                - true
                properties:
                  action:
                    const: alwaysReady
                  true:
                    type: boolean
              - type: object
                required:
                - action
                properties:
                  action:
                    const: handoff
                description: Start phone handoff; returns `url`.
              - type: object
                required:
                - action
                properties:
                  action:
                    const: handoffStop
              - type: object
                required:
                - action
                properties:
                  action:
                    const: done
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/settings:
    get:
      tags:
      - settings
      summary: MQTT / device settings
      description: The MQTT password is never returned, only `passwordSet`.
      responses:
        '200':
          description: Settings and live MQTT status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - settings
      summary: Save MQTT / device settings (restarts the server)
      description: 'Writes `config.json` and restarts after about 250 ms; the 200 reply is

        sent first. `port`, `host`, `token`, `allowControl` and `allowPower`

        are file-only and cannot be set here. Body max 8 KiB. Omitting

        `mqtt.password` keeps the stored one; `""` clears it.

        '
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsWrite'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  restarting:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/BadContentType'
        '500':
          $ref: '#/components/responses/Error'
  /api/backup:
    get:
      tags:
      - settings
      summary: Create a settings backup
      responses:
        '200':
          description: Backup document (save as a file).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags:
      - settings
      summary: Restore a settings backup
      description: Body is a backup document, max 64 KiB. May restart the server.
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/BadContentType'
  /api/backup/saved:
    get:
      tags:
      - settings
      summary: Download a daily backup kept on the TV
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Backup document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'
  /api/backup/apps:
    get:
      tags:
      - settings
      summary: Apps a restored backup listed that this TV lacks
      responses:
        '200':
          description: Pending apps.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  apps:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/backup/apps/clear:
    post:
      tags:
      - settings
      summary: Clear the pending-apps list
      x-gates:
      - allowControl
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/privacy:
    get:
      tags:
      - privacy
      summary: Privacy state (consent, ad blocking, ACR, ...)
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Privacy'
  /api/adblock/custom:
    post:
      tags:
      - privacy
      summary: Upload or manage the owner's own ad-block hosts list
      description: Body max 1 MiB. `{mode,text}` uploads, `{mode}` changes use, `{clear:true}` removes.
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: Mode name defined in lib/privacy.js (not read).
                text:
                  type: string
                  description: Hosts file contents.
                clear:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps:
    get:
      tags:
      - apps
      summary: Installed apps, tiles, services, preload, quick access, remote keys
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppsList'
  /api/apps/icon:
    get:
      tags:
      - apps
      summary: An app's icon
      parameters:
      - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    head:
      tags:
      - apps
      summary: An app's icon (headers only)
      parameters:
      - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: Exists.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/apps/add-page:
    post:
      tags:
      - apps
      summary: Save a web page as an app tile
      requestBody:
        required: true
        content:
