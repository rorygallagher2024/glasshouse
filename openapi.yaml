    ControlRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          description: 'Action name; unknown names return `ok: false`. Aliases share a line.

            Value legend: **bool** = true/"on"/"ON"/"true"; **str** = string.

            - Audio/screen: `volume` (int 0-100), `volumeStep` (int -100..100, default 1), `mute` (bool,
            also "1"/1), `screenOff`, `screenOn`, `sound_output`|`soundOutput` (str, e.g. tv_speaker,
            optical, external_arc, bt_soundbar, headphone), `playback`|`media` (play, pause, stop, fastForward,
            rewind, playPause)

            - Input/apps: `input` (str: hdmi1..hdmi4), `launch_app`|`launchApp` (app id or title), `launch_url`|`launchUrl`
            (http(s) URL), `close_app`|`closeApp` (app id), `toast` (string, or object with `type` standard|advanced|light)

            - Remote/typing: `rcu` (str: up, down, left, right, ok, back, settings, home), `sendText`
            (string, or {text, replace, enter, full}; text up to 500 chars), `keyboardText` (str up to
            100 chars), `keyboardKey` (enter|backspace)

            - Picture: `picture_mode`|`pictureMode` (str), `energySaving` (auto, off, min, med, max, screen_off),
            `backlight` (0-100), `lgSetting` ({id, on} or {id, value}), `screensaverMode` (str or {mode,
            level}), `screensaver` (trigger), `screenShift` (bool), `logoDimming` (str: off, light, strong)

            - OLED: `oledProtection` ({key: gsr|tpc, enabled}), `serviceMenuLock` ({locked}), `serviceMenuOpen`
            ({menu}, default ezAdjust), `refresherSchedule`, `refresherCancel`

            - Lights/power settings: `standbyLight`, `logoLight`, `lgLogo`, `quickBoot`, `homeAutoLaunch`,
            `deviceDetection`, `alwaysReady`, `alwaysReadyScreen` (all bool); `alwaysReadyOffStart` (hour
            0-23, "H" or "H:MM"), `sleepTimer` (off, 10, 30, 60, 90, 120), `powerTimer` (object, see lib/timers.js),
            `clockHour12`, `wakeOnLan` (bool)

            - Power (also need allowPower): `powerOn`, `powerOff`, `reboot`

            - Privacy: `adblock`|`setAdBlock`|`toggleAdBlock` (off, ads, full, toggle, or bool), `privacyAllOff`,
            `resetAdId`, `limitAdTracking` (bool), `acr` (bool), `consent` ({key, enabled}), `clearAdCookies`,
            `blockTvUpdates` (bool)

            - Ambient: `piccap` (bool), `huesync` (bool)

            - Glasshouse itself: `updateCheck` (value "open" caches 2 min), `update`, `updateAutoCheck`
            (bool), `updateRollback`, `tvAppInstall`, `tvAppRemove`, `tileHiding` (bool), `setTileHidingAllowed`
            (bool), `setWebos10ScreensaversAllowed` (bool), `screensaverPowerOff` (minutes or blank),
            `setDashboardPort` (1024-65533, not 9996-9998; restarts), `setPrometheusEnabled` (bool), `setNtpServer`
            (host[:port]), `setNtpEnabled` (bool), `setDeviceName` (str up to 64 chars), `setHistoryEnabled`
            (bool), `clearHistory`, `setBackupDaily` (bool), `setNetworkDebuggerAllowed` (bool)

            '
        value:
          description: Depends on `action`; see the action list. Often a bool, string or number; some
            take an object.
