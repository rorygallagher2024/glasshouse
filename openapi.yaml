                key:
                  type: string
                action:
                  type: string
                id:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Error'
  /api/homescreen:
    post:
      tags:
      - home
      summary: Change LG's Home layout
      description: Send exactly one of the four shapes (checked in this order).
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                required:
                - allow
                properties:
                  allow:
                    type: boolean
                    description: Allow Glasshouse to change the layout (saved).
              - type: object
                required:
                - restore
                properties:
                  restore:
                    const: true
              - type: object
                required:
                - part
                properties:
                  part:
                    type: string
                  shown:
                    type: boolean
              - type: object
                required:
                - banner
                properties:
                  banner:
                    type: string
              - type: object
                required:
                - input
                properties:
                  input:
                    type: string
                  onHome:
                    type: boolean
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Error'
  /api/homescreen/banner:
    post:
      tags:
      - home
      summary: Upload a Home banner image
      description: 'Exact `Content-Type: image/jpeg`; body is the JPEG.'
      x-gates:
      - allowControl
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/BadContentType'
        '503':
          $ref: '#/components/responses/Error'
  /api/apps/catalog:
    get:
      tags:
      - install
      summary: Homebrew Channel catalog (plus added catalogs)
      description: Install routes need `allowControl` and an allowed Host header (IP literal, `localhost`,
        or a name in `apps.hosts`).
      x-gates:
      - allowControl
      - hostAllowed
      parameters:
      - name: force
        in: query
        schema:
          type: string
        description: Any value bypasses the cache.
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/status:
    get:
      tags:
      - install
      summary: Install job status and sideload permission
      x-gates:
      - allowControl
      - hostAllowed
      responses:
        '200':
          description: Job snapshot plus `sideload` and `sideloadVia`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  ok:
                    type: boolean
                  writable:
                    type: boolean
                  sideload:
                    type: boolean
                  sideloadVia:
                    type:
                    - string
                    - 'null'
                    enum:
                    - config
                    - token
                    - tv
                    - null
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/fetch:
    post:
      tags:
      - install
      summary: Start installing a catalog app
      description: Catalog installs must be https and match the catalog's sha256. Starts a job that stops
        for confirmation via `/confirm`.
      x-gates:
      - allowControl
      - hostAllowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: string
                  description: App id in the catalog.
                repo:
                  type: string
                  description: Catalog URL to take it from.
                auto:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/InstallOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/url:
    post:
      tags:
      - install
      summary: Start installing an .ipk from a URL (sideload)
      description: Refused (403) unless `apps.sideload` is true, a token is set, or the request is from
        the TV.
      x-gates:
      - allowControl
      - hostAllowed
      - sideload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                sha256:
                  type: string
                  pattern: ^[0-9a-fA-F]{64}$
      responses:
        '200':
          $ref: '#/components/responses/InstallOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/upload:
    post:
      tags:
      - install
      summary: Upload an .ipk to install (sideload)
      description: 'Exact `Content-Type: application/octet-stream` and a `Content-Length`

        (411 without; chunked is refused). Size up to 512 MB per the code''s

        comments. Same sideload gate as `/url`.

        '
      x-gates:
      - allowControl
      - hostAllowed
      - sideload
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          $ref: '#/components/responses/InstallOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '411':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/BadContentType'
  /api/apps/install/confirm:
    post:
      tags:
      - install
      summary: Confirm a previewed install
      description: Root for URL/file/extra-catalog packages must be confirmed service by service via `confirmRoot`.
      x-gates:
      - allowControl
      - hostAllowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
                elevate:
                  type: boolean
                confirmRoot:
                  description: Services the preview listed (shape defined in lib/installer.js, not read).
                replaceStore:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/InstallOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/cancel:
    post:
      tags:
      - install
      summary: Cancel an install job
      x-gates:
      - allowControl
      - hostAllowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jobId:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/OkObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/repos:
    post:
      tags:
      - install
      summary: Add or remove an extra catalog
      description: At most 10 added catalogs; each must be https. Same sideload gate as `/url`. Persisted
        to `config.json` (`apps.repos`).
      x-gates:
      - allowControl
      - hostAllowed
      - sideload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - url
              properties:
                action:
                  type: string
                  enum:
                  - add
                  - remove
                url:
                  type: string
      responses:
        '200':
          description: Updated list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  repos:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/apps/install/sideload:
    post:
      tags:
      - install
      summary: Turn sideloading on or off
      description: Persisted as `apps.sideload`. On a default install this is a speed bump, not a lock;
        a token is what stops others turning it on.
      x-gates:
      - allowControl
      - hostAllowed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sideload:
                    type: boolean
                  sideloadVia:
                    type:
                    - string
                    - 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/home:
